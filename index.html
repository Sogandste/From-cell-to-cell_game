  setFont(f) { this.fontFamily = f; }

  /* ─── game API ─── */
  launch(kind) {
    if (!this.started || this.paused || this.dead) return false;
    if (kind === "migrasome") {
      if (this.migrating) { this.emit("onToast", "queueFull", "warn"); return false; }
      if (this.atp < getPathway("migrasome").atpCost) { this.emit("onToast", "noAtp", "warn"); return false; }
      this.aiming = !this.aiming;
      return this.aiming;
    }
    if (this.dying) return false;
    if (this.buildQueue.length >= 2) { this.emit("onToast", "queueFull", "warn"); return false; }
    const info = getPathway(kind);
    if (this.atp < info.atpCost) { this.emit("onToast", "noAtp", "warn"); return false; }
    const tgt = this.chooseTarget();
    if (!tgt) { this.emit("onToast", "noTarget", "warn"); return false; }
    this.atp -= info.atpCost;
    const dur = (info.prodMs / 1000) * Math.pow(0.82, this.upg.escrt);
    this.buildQueue.push({ kind, t: 0, dur, targetId: tgt.id });
    this.emit("onSfx", "bud");
    if (!this.discovered.has(kind)) {
      this.discovered.add(kind);
      this.emit("onDiscovery", kind);
    }
    return true;
  }

  pointerDown(x, y) {
    if (!this.started || this.dead) return;
    if (this.aiming && !this.paused) {
      const info = getPathway("migrasome");
      if (this.atp < info.atpCost) { this.emit("onToast", "noAtp", "warn"); return; }
      const tx = _clamp(x, 60, this.W - 60);
      const ty = _clamp(y, 90, this.H - 150);
      const d = _dist(this.cell.x, this.cell.y, tx, ty);
      if (d < 40) { this.aiming = false; return; }
      this.atp -= info.atpCost;
      const spd = info.speed * Math.pow(1.35, this.upg.lame);
      const trail = { x1: this.cell.x, y1: this.cell.y, x2: this.cell.x, y2: this.cell.y, life: 7, maxLife: 7, bulbs: [] };
      this.trails.push(trail);
      this.activeTrail = trail;
      this.migrating = { x1: this.cell.x, y1: this.cell.y, x2: tx, y2: ty, t: 0, dur: d / spd, lastBulbAt: 0 };
      if (!this.discovered.has("migrasome")) {
        this.discovered.add("migrasome");
        this.emit("onDiscovery", "migrasome");
      }
      this.aiming = false;
      return;
    }
    /* pin a target */
    const hit = this.targets.find((t) => t.state === "active" && _dist(x, y, t.x, t.y) < t.r + 16);
    this.pinned = hit ? (this.pinned === hit.id ? null : hit.id) : null;
  }

  pointerMove(x, y) {
    this.pointer.x = x;
    this.pointer.y = y;
  }

  pause() { this.paused = true; }
  resume() { this.paused = false; }

  labResult(ok) {
    this.labTotal++;
    const bonus = Math.round(150 * (1 + (this.phase - 1) * 0.12));
    if (ok) {
      this.labOk++;
      this.score += bonus;
      this.rp += 1;
      this.pushFloat(this.cell.x, this.cell.y - 70, "#9BE1FF", "rp", 1);
    } else if (this.upg.misev < 1) {
      this.vitality = Math.max(0, this.vitality - 4);
    }
    this.paused = false;
    this.labT = 0;
    if (this.vitality <= 0) this.beginDeath();
  }

  startNextPhase() {
    this.phase++;
    this.phaseT = 0;
    this.rp += 2;
    this.timeScale = 0.35; /* slow motion phase opener */
    this.paused = false;
    if (this.phase >= 2 && this.macros.length === 0) this.spawnMacro();
    else if (this.phase >= 4 && this.macros.length === 1) this.spawnMacro();
    else if (this.phase >= 7 && this.macros.length === 2) this.spawnMacro();
    if (this.phase >= 3 && this.opsonins.length === 0) this.spawnOpsonin();
    else if (this.phase >= 5 && this.opsonins.length === 1) this.spawnOpsonin();
    else if (this.phase >= 8 && this.opsonins.length === 2) this.spawnOpsonin();
    this.checkFlag("phase5", this.phase >= 5, "phase5", "info");
  }

  buyUpgrade(id) {
    const u = this.upg[id] ?? 0;
    const costs = { escrt: [2, 3, 4], mito: [2, 3, 4], cd47: [3, 4], ribo: [2, 3, 4], misev: [2, 3], lame: [2, 3] };
    const maxT = { escrt: 3, mito: 3, cd47: 2, ribo: 3, misev: 2, lame: 2 };
    if (u >= maxT[id]) return false;
    const cost = costs[id][u];
    if (this.rp < cost) return false;
    this.rp -= cost;
    this.upg[id] = u + 1;
    if (id === "mito") this.atpRegen = 6 * Math.pow(1.35, this.upg.mito);
    return true;
  }

  getUpgrades() { return { ...this.upg }; }

  getHud() {
    return {
      score: Math.round(this.score),
      combo: this.combo,
      comboFrac: this.combo > 0 ? _clamp(this.comboT / 5.2, 0, 1) : 0,
      vitality: Math.round(this.vitality),
      atp: Math.round(this.atp),
      atpMax: this.atpMax,
      rp: this.rp,
      phase: this.phase,
      phaseFrac: _clamp(this.phaseT / this.phaseDur, 0, 1),
      cargo: { ...this.cargo },
      cargoMax: this.cargoMax,
      building: this.buildQueue.map((b) => ({ kind: b.kind, frac: _clamp(b.t / b.dur, 0, 1) })),
      aiming: this.aiming,
      migrating: this.migrating !== null,
      dying: this.dying,
      targetsActive: this.targets.filter((t) => t.state === "active").length,
      macros: this.macros.length,
    };
  }

  /* ─── internal logic ─── */
  emit(name, ...args) { if (typeof this.ev[name] === "function") this.ev[name](...args); }

  chooseTarget() {
    const act = this.targets.filter((t) => t.state === "active");
    if (act.length === 0) return null;
    const pin = this.pinned ? act.find((t) => t.id === this.pinned) : null;
    if (pin && this.cargo[pin.demand] > 0) return pin;
    let best = null;
    let bestScore = -1;
    for (const t of act) {
      const hasCargo = this.cargo[t.demand] > 0;
      const urgency = 1 - t.patience;
      const d = _dist(this.cell.x, this.cell.y, t.x, t.y) / (this.W + this.H);
      const s = urgency * 2 + (1 - d) * 0.8 + (hasCargo ? 1.2 : 0) + (t.need > t.deliveredN ? 0 : -9);
      if (s > bestScore) { bestScore = s; best = t; }
    }
    return best;
  }

  spawnTarget() {
    if (this.targets.filter((t) => t.state !== "satisfied" && t.state !== "failed").length >= 6) return;
    const id = this.nextId++;
    const demand = DEMAND_KINDS[Math.floor(Math.random() * DEMAND_KINDS.length)];
    const big = this.phase >= 2 && Math.random() < 0.22;
    const margin = 80;
    let x = 0;
    let y = 0;
    for (let i = 0; i < 12; i++) {
      x = margin + Math.random() * (this.W - margin * 2);
      y = this.H * 0.17 + Math.random() * (this.H * 0.44);
      const okDist = this.targets.every(
        (t) => (t.state === "incoming" || t.state === "active") ? _dist(x, y, t.x, t.y) > 120 : true,
      );
      if (okDist && _dist(x, y, this.cell.x, this.cell.y) > 190) break;
    }
    const patienceMs = Math.max(11, 24 - (this.phase - 1) * 1.8) * (big ? 1.8 : 1) * 1000;
    this.targets.push({
      id, x, y,
      r: big ? 36 : 30,
      demand,
      need: big ? 2 : 1,
      deliveredN: 0,
      patience: 1,
      patienceMs,
      state: "incoming",
      stateT: 0,
      seed: Math.random() * 100,
    });
  }

  spawnMacro() {
    const side = Math.random() < 0.5 ? 0 : 1;
    this.macros.push({
      id: this.nextId++,
      x: side ? this.W + 60 : -60,
      y: this.H * 0.3 + Math.random() * this.H * 0.35,
      tx: this.W * (0.2 + Math.random() * 0.6),
      ty: this.H * (0.2 + Math.random() * 0.4),
      r: 30,
      speed: 34 + Math.min(26, this.phase * 3),
      hunt: null,
      gulpT: 0,
      seed: Math.random() * 100,
    });
    this.checkFlag("macro", true, "macro", "warn");
  }

  spawnOpsonin() {
    this.opsonins.push({
      id: this.nextId++,
      x: Math.random() * this.W,
      y: Math.random() * this.H * 0.7,
      vx: (Math.random() - 0.5) * 30,
      vy: (Math.random() - 0.5) * 30,
      seed: Math.random() * 100,
    });
    this.checkFlag("opsonin", true, "opsonin", "warn");
  }

  checkFlag(flag, cond, toastKey, tone) {
    if (cond && !this.flags.has(flag)) {
      this.flags.add(flag);
      this.emit("onToast", toastKey, tone);
    }
  }

  pushFloat(x, y, color, kind, n, key, big) {
    this.floats.push({ x, y, life: 0, maxLife: 1.1, color, kind, n, key, big: !!big });
    if (this.floats.length > 14) this.floats.shift();
  }

  burst(x, y, color, count = 14, speed = 90) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = speed * (0.3 + Math.random() * 0.9);
      this.particles.push({
        x, y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s,
        life: 0,
        maxLife: 0.5 + Math.random() * 0.5,
        r: 1 + Math.random() * 2.4,
        color,
        glow: true,
      });
    }
    if (this.particles.length > 300) this.particles.splice(0, this.particles.length - 300);
  }

  ripple(x, y, color, r1 = 70) {
    this.ripples.push({ x, y, life: 0, maxLife: 0.7, r0: 8, r1, color, width: 2.5 });
  }

  deliverTarget(t, kind, mult, isGift = false) {
    t.deliveredN++;
    const info = getPathway(kind);
    const urgency = t.patience;
    let pts = 60 * (0.4 + 0.6 * urgency) * (info.scoreMult * mult) * (1 + Math.max(0, this.combo - 1) * 0.22) * (1 + (this.phase - 1) * 0.12);
    if (isGift) pts *= 0.4;
    pts = Math.max(5, Math.round(pts));
    this.score += pts;
    this.delivered++;
    this.byPathway[kind]++;
    this.delSinceRp++;
    if (this.delSinceRp >= 3) {
      this.delSinceRp = 0;
      this.rp++;
      this.pushFloat(this.cell.x, this.cell.y - 70, "#B9F0D2", "rp", 1);
    }
    /* combo */
    this.combo++;
    this.comboT = 5.2;
    this.bestCombo = Math.max(this.bestCombo, this.combo);
    this.vitality = Math.min(100, this.vitality + 2);
    this.pushFloat(t.x, t.y - t.r - 18, info.color, "score", pts, undefined, this.combo >= 5);
    this.burst(t.x, t.y, info.color, 12, 80);
    this.ripple(t.x, t.y, info.color, t.r + 46);
    this.emit("onSfx", "fuse");
    this.checkFlag("firstDelivery", this.delivered >= 1, "firstDelivery", "good");
    this.checkFlag("del10", this.delivered >= 10, "del10", "good");
    this.checkFlag("del25", this.delivered >= 25, "del25", "good");
    this.checkFlag("del50", this.delivered >= 50, "del50", "good");
    this.checkFlag("del100", this.delivered >= 100, "del100", "good");
    this.checkFlag("combo5", this.combo >= 5, "combo5", "good");
    this.checkFlag("combo10", this.combo >= 10, "combo10", "good");
    if (t.deliveredN >= t.need) {
      t.state = "satisfied";
      t.stateT = 0;
    }
  }

  failTarget(t) {
    t.state = "failed";
    t.stateT = 0;
    this.failed++;
    this.combo = 0;
    this.comboT = 0;
    const dmg = 12 + Math.min(8, this.phase);
    this.vitality = Math.max(0, this.vitality - dmg);
    this.shakeT = 0.45;
    this.shakeMag = 7;
    this.failFlash = 0.7;
    this.emit("onToast", "failed", "warn");
    this.emit("onSfx", "fail");
    this.burst(t.x, t.y, "#E46A6A", 10, 60);
    if (this.vitality <= 0) this.beginDeath();
    else if (this.vitality < 30) this.checkFlag("vitalityLow", true, "vitalityLow", "warn");
  }

  beginDeath() {
    if (this.dying) return;
    this.dying = true;
    this.deathT = 0;
    this.buildQueue = [];
    this.aiming = false;
    this.emit("onSfx", "gameover");
  }

  spawnVesicle(b) {
    const info = getPathway(b.kind);
    let tgt = this.targets.find((t) => t.id === b.targetId && t.state === "active");
    if (!tgt || (tgt.need <= tgt.deliveredN && this.cargo[tgt.demand] <= 0)) tgt = this.chooseTarget() || tgt;
    let cargo = "generic";
    if (tgt && this.cargo[tgt.demand] > 0) {
      this.cargo[tgt.demand]--;
      cargo = tgt.demand;
    }
    const dirA = Math.atan2((tgt ? tgt.y : this.cell.y - 200) - this.cell.y, (tgt ? tgt.x : this.cell.x) - this.cell.x);
    const id = this.nextId++;
    this.vesicles.push({
      id,
      kind: b.kind,
      x: this.cell.x + Math.cos(dirA) * (this.cell.r + info.radius + 2),
      y: this.cell.y + Math.sin(dirA) * (this.cell.r + info.radius + 2),
      vx: Math.cos(dirA) * info.speed,
      vy: Math.sin(dirA) * info.speed,
      r: info.radius,
      speed: info.speed,
      targetId: tgt ? tgt.id : -1,
      cargo,
      born: this.simT,
      life: info.lifeMs / 1000,
      tagged: false,
      state: "travel",
      fuseT: 0,
      trail: [],
      seed: Math.random() * 100,
    });
    this.ripple(this.cell.x, this.cell.y, info.color, this.cell.r + 60);
    this.emit("onSfx", "launch");
  }

  /* ─── update loop ─── */
  update(dtRaw) {
    const dt = Math.min(0.05, Math.max(0, dtRaw));
    this.drawT += dt;
    if (!this.started || this.paused) return;
    const sdt = dt * this.timeScale;
    this.simT += sdt;
    this.timeScale = _lerp(this.timeScale, 1, Math.min(1, dt * 1.6));

    if (this.dead) {
      this.updateEffects(sdt);
      return;
    }

    /* dying */
    if (this.dying) {
      this.deathT += sdt;
      if (Math.random() < sdt * 14) {
        const a = Math.random() * Math.PI * 2;
        this.burst(this.cell.x + Math.cos(a) * this.cell.r * 0.8, this.cell.y + Math.sin(a) * this.cell.r * 0.8, "#E4EDFA", 4, 45);
      }
      if (this.deathT > 2.4) {
        this.dead = true;
        this.emit("onGameOver", this.summary());
      }
      this.updateEffects(sdt);
      return;
    }

    /* resources */
    this.atp = Math.min(this.atpMax, this.atp + this.atpRegen * sdt);
    this.cargoT += sdt;
    const cargoEvery = 7 / Math.pow(1.4, this.upg.ribo);
    if (this.cargoT >= cargoEvery) {
      this.cargoT = 0;
      const k = DEMAND_KINDS[Math.floor(Math.random() * DEMAND_KINDS.length)];
      this.cargo[k] = Math.min(this.cargoMax, this.cargo[k] + 1);
    }

    /* build queue */
    if (this.buildQueue.length > 0) {
      const b = this.buildQueue[0];
      b.t += sdt;
      if (b.t >= b.dur) {
        this.buildQueue.shift();
        this.spawnVesicle(b);
      }
    }

    /* migration + migrasome */
    if (this.migrating) {
      const m = this.migrating;
      m.t += sdt;
      const f = _clamp(m.t / m.dur, 0, 1);
      const nx = _lerp(m.x1, m.x2, f);
      const ny = _lerp(m.y1, m.y2, f);
      const moved = _dist(m.lastBulbAt === 0 ? m.x1 : this.cell.x, m.lastBulbAt === 0 ? m.y1 : this.cell.y, nx, ny);
      const bulbEvery = 84 / Math.pow(1.18, this.upg.lame);
      if ((moved > bulbEvery || m.lastBulbAt === 0) && this.activeTrail) {
        m.lastBulbAt = 1;
        this.activeTrail.bulbs.push({
          x: nx + (Math.random() - 0.5) * 14,
          y: ny + (Math.random() - 0.5) * 14,
          r: 12 + Math.random() * 5,
          life: 7,
          served: [],
          seed: Math.random() * 100,
        });
        this.activeTrail.x2 = nx;
        this.activeTrail.y2 = ny;
      }
      this.cell.x = nx;
      this.cell.y = ny;
      if (f >= 1) {
        this.migrating = null;
        this.activeTrail = null;
      }
    }

    /* new targets keep arriving */
    const wantTargets = Math.min(6, 3 + Math.floor(this.phase / 2));
    const activeN = this.targets.filter((t) => t.state === "incoming" || t.state === "active").length;
    if (activeN < wantTargets && Math.random() < sdt * 0.7) this.spawnTarget();

    /* targets */
    for (const t of this.targets) {
      t.stateT += sdt;
      if (t.state === "incoming" && t.stateT > 0.5) {
        t.state = "active";
        t.stateT = 0;
      } else if (t.state === "active") {
        t.patience -= (sdt * 1000) / t.patienceMs;
        if (t.patience <= 0) {
          t.patience = 0;
          this.failTarget(t);
        }
      } else if ((t.state === "satisfied" || t.state === "failed") && t.stateT > 0.8) {
        t.stateT = 0;
      }
    }
    this.targets = this.targets.filter((t) => !(t.state === "satisfied" || t.state === "failed") || t.stateT < 0.8);

    /* vesicles */
    for (const v of this.vesicles) {
      if (v.state === "fusing") {
        v.fuseT += sdt;
        continue;
      }
      const age = this.simT - v.born;
      if (age > v.life) {
        v.state = "fusing";
        v.fuseT = 99;
        continue;
      }
      const tgt = this.targets.find((t) => t.id === v.targetId && t.state === "active");
      if (!tgt) {
        const alt = this.chooseTarget();
        if (alt) {
          v.targetId = alt.id;
          if (v.cargo === "generic" && this.cargo[alt.demand] > 0) {
            this.cargo[alt.demand]--;
            v.cargo = alt.demand;
          }
        }
      }
      const tx = tgt ? tgt.x : v.x + v.vx;
      const ty = tgt ? tgt.y : v.y + v.vy;
      const d = Math.max(1, _dist(v.x, v.y, tx, ty));
      const wob = Math.sin(this.simT * 3 + v.seed) * 0.35;
      const ang = Math.atan2(ty - v.y, tx - v.x) + wob * 0.2;
      const sp = v.speed * (v.kind === "blebbisome" ? 1 : 1.05);
      v.vx = _lerp(v.vx, Math.cos(ang) * sp, Math.min(1, sdt * 4));
      v.vy = _lerp(v.vy, Math.sin(ang) * sp, Math.min(1, sdt * 4));
      v.x += v.vx * sdt;
      v.y += v.vy * sdt;
      v.trail.push({ x: v.x, y: v.y });
      if (v.trail.length > 9) v.trail.shift();
      if (tgt && _dist(v.x, v.y, tgt.x, tgt.y) < tgt.r + v.r + 2) {
        v.state = "fusing";
        v.fuseT = 0;
        /* delivery */
        const matched = v.cargo === tgt.demand;
        if (matched) {
          this.deliverTarget(tgt, v.kind, 1);
          if (v.kind === "blebbisome") {
            /* blebbisome: area delivery + gift sEV */
            for (const t2 of this.targets) {
              if (t2.state === "active" && t2 !== tgt && _dist(v.x, v.y, t2.x, t2.y) < 150) {
                this.deliverTarget(t2, "blebbisome", 1);
              }
            }
            if (Math.random() < 0.35) {
              const near = this.targets.find((t2) => t2.state === "active" && t2.need > t2.deliveredN);
              if (near) {
                this.emit("onToast", "blebGift", "good");
                this.deliverTarget(near, "exosome", 1, true);
              }
            }
          }
        } else {
          /* generic cargo: half score */
          this.score += 30;
          this.pushFloat(tgt.x, tgt.y - tgt.r - 18, "#8B98B4", "score", 30);
          this.ripple(tgt.x, tgt.y, "#8B98B4", 40);
        }
      }
    }
    this.vesicles = this.vesicles.filter((v) => {
      if (v.state === "fusing") return v.fuseT < 0.15;
      return true;
    });

    /* migrasome trails */
    for (const tr of this.trails) {
      tr.life -= sdt;
      const radius = 115 * Math.pow(1.25, this.upg.lame);
      for (const b of tr.bulbs) {
        b.life -= sdt;
        for (const t of this.targets) {
          if (t.state === "active" && !b.served.includes(t.id) && _dist(b.x, b.y, t.x, t.y) < radius) {
            if (this.cargo[t.demand] > 0) {
              this.cargo[t.demand]--;
              b.served.push(t.id);
              this.deliverTarget(t, "migrasome", 1);
            }
          }
        }
      }
      tr.bulbs = tr.bulbs.filter((b) => b.life > 0);
    }
    this.trails = this.trails.filter((t) => t.life > 0 && t.bulbs.length > 0);

    /* macrophages */
    for (const m of this.macros) {
      if (m.gulpT > 0) {
        m.gulpT -= sdt;
        continue;
      }
      /* pick a hunt */
      let best = null;
      let bestD = 1e9;
      const cdMul = Math.pow(0.7, this.upg.cd47);
      for (const v of this.vesicles) {
        const detR = (v.tagged ? 300 : getPathway(v.kind).detectR) * cdMul;
        const d = _dist(m.x, m.y, v.x, v.y);
        if (d < detR && d < bestD) { bestD = d; best = v; }
      }
      if (best) {
        m.hunt = best.id;
        const sp = 95 + Math.min(55, this.phase * 4);
        const a = Math.atan2(best.y - m.y, best.x - m.x);
        m.x += Math.cos(a) * sp * sdt;
        m.y += Math.sin(a) * sp * sdt;
        if (_dist(m.x, m.y, best.x, best.y) < m.r + best.r) {
          /* gulp! */
          this.vesicles = this.vesicles.filter((v) => v.id !== best.id);
          m.gulpT = 0.6;
          m.hunt = null;
          this.lost++;
          this.burst(best.x, best.y, "#B9C0CE", 16, 90);
          this.ripple(best.x, best.y, "#E46A6A", 60);
          this.pushFloat(best.x, best.y - 20, "#E46A6A", "label", undefined, "engulfed");
          this.emit("onToast", "engulfed", "warn");
          this.emit("onSfx", "gulp");
        }
      } else {
        m.hunt = null;
        if (_dist(m.x, m.y, m.tx, m.ty) < 30) {
          m.tx = 60 + Math.random() * (this.W - 120);
          m.ty = this.H * 0.15 + Math.random() * (this.H * 0.55);
        }
        const a = Math.atan2(m.ty - m.y, m.tx - m.x);
        m.x += Math.cos(a) * m.speed * sdt;
        m.y += Math.sin(a) * m.speed * sdt;
      }
      m.x = _clamp(m.x, -80, this.W + 80);
      m.y = _clamp(m.y, 40, this.H - 60);
    }

    /* opsonins */
    for (const o of this.opsonins) {
      o.vx += (Math.random() - 0.5) * 24 * sdt;
      o.vy += (Math.random() - 0.5) * 24 * sdt;
      o.vx = _clamp(o.vx, -26, 26);
      o.vy = _clamp(o.vy, -26, 26);
      o.x = (o.x + o.vx * sdt + this.W) % this.W;
      o.y = _clamp(o.y + o.vy * sdt, 40, this.H - 80);
      for (const v of this.vesicles) {
        if (!v.tagged && _dist(o.x, o.y, v.x, v.y) < v.r + 12) {
          v.tagged = true;
          this.pushFloat(v.x, v.y - v.r - 12, "#E46A6A", "label", undefined, "tagged");
          this.emit("onToast", "tagged", "warn");
          this.emit("onSfx", "tag");
          this.ripple(v.x, v.y, "#E46A6A", 40);
        }
      }
    }

    /* timers */
    this.comboT -= sdt;
    if (this.comboT <= 0 && this.combo > 0) this.combo = 0;
    this.phaseT += sdt;
    if (this.phaseT >= this.phaseDur) {
      this.phaseT = this.phaseDur;
      this.paused = true;
      this.emit("onPhaseClear", this.phase);
    }
    this.labT += sdt;
    if (this.labT >= this.labEvery) {
      this.labT = 0;
      this.paused = true;
      this.checkFlag("lab", true, "lab", "info");
      this.emit("onLabCheck");
    }

    this.updateEffects(sdt);
  }

  updateEffects(sdt) {
    for (const p of this.particles) {
      p.life += sdt;
      p.x += p.vx * sdt;
      p.y += p.vy * sdt;
      p.vx *= 0.985;
      p.vy *= 0.985;
    }
    this.particles = this.particles.filter((p) => p.life < p.maxLife);
    for (const r of this.ripples) r.life += sdt;
    this.ripples = this.ripples.filter((r) => r.life < r.maxLife);
    for (const f of this.floats) f.life += sdt;
    this.floats = this.floats.filter((f) => f.life < f.maxLife);
    if (this.shakeT > 0) this.shakeT -= sdt;
    if (this.failFlash > 0) this.failFlash -= sdt;
    for (const d of this.bgDrift) {
      d.x = (d.x + d.vx * sdt + this.W) % this.W;
      d.y = (d.y + d.vy * sdt + this.H) % this.H;
    }
  }

  summary() {
    return {
      score: Math.round(this.score),
      phase: this.phase,
      delivered: this.delivered,
      failed: this.failed,
      lost: this.lost,
      labOk: this.labOk,
      labTotal: this.labTotal,
      bestCombo: this.bestCombo,
      byPathway: { ...this.byPathway },
      discovered: Array.from(this.discovered),
    };
  }

  /* ══════════ render ══════════ */
  draw(ctx) {
    const t = this.drawT;
    const S = STR[this.lang];
    ctx.save();
    /* scene shake */
    if (this.shakeT > 0) {
      const m = this.shakeMag * (this.shakeT / 0.45);
      ctx.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m);
    }
    /* background */
    const g = ctx.createLinearGradient(0, 0, 0, this.H);
    g.addColorStop(0, "#04070E");
    g.addColorStop(0.55, "#081226");
    g.addColorStop(1, "#0C1B33");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, this.W, this.H);

    /* cell halo */
    const cg = ctx.createRadialGradient(this.cell.x, this.cell.y, 20, this.cell.x, this.cell.y, 340);
    const comboCol = this.combo >= 5 ? "#9BE1FF" : "#3E6FA8";
    cg.addColorStop(0, "rgba(111, 214, 255, 0.10)");
    cg.addColorStop(0.5, "rgba(62, 111, 168, 0.05)");
    cg.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = cg;
    ctx.fillRect(0, 0, this.W, this.H);

    /* ECM fibers (parallax) */
    if (this.ecmCanvas) {
      ctx.globalAlpha = 0.9;
      const off = (t * 2.2) % this.H;
      ctx.drawImage(this.ecmCanvas, 0, off - this.H);
      ctx.drawImage(this.ecmCanvas, 0, off);
      ctx.globalAlpha = 1;
    }

    /* floating specks (lipoproteins) */
    for (const d of this.bgDrift) {
      ctx.fillStyle = `rgba(139, 152, 180, ${d.a})`;
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
      ctx.fill();
    }

    /* targets */
    for (const tg of this.targets) this.drawTarget(ctx, tg, t);

    /* migrasome trails */
    for (const tr of this.trails) this.drawTrail(ctx, tr, t);

    /* vesicles */
    for (const v of this.vesicles) this.drawVesicle(ctx, v, t);

    /* producer cell */
    this.drawCell(ctx, t, comboCol);

    /* macrophages */
    for (const m of this.macros) this.drawMacro(ctx, m, t);

    /* opsonins */
    for (const o of this.opsonins) this.drawOpsonin(ctx, o, t);

    /* additive fx */
    ctx.globalCompositeOperation = "lighter";
    for (const p of this.particles) {
      const a = 1 - p.life / p.maxLife;
      ctx.fillStyle = p.color;
      ctx.globalAlpha = a * 0.9;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * (0.5 + a * 0.5), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    for (const r of this.ripples) {
      const f = r.life / r.maxLife;
      ctx.strokeStyle = r.color;
      ctx.globalAlpha = (1 - f) * 0.7;
      ctx.lineWidth = r.width * (1 - f * 0.5);
      ctx.beginPath();
      ctx.arc(r.x, r.y, _lerp(r.r0, r.r1, f), 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";

    /* floating texts */
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    try { ctx.direction = this.lang === "fa" ? "rtl" : "ltr"; } catch (e) { /* older browsers */ }
    for (const f of this.floats) {
      const p = f.life / f.maxLife;
      const y = f.y - p * 46;
      const a = p < 0.15 ? p / 0.15 : 1 - (p - 0.15) / 0.85;
      ctx.globalAlpha = _clamp(a, 0, 1);
      ctx.fillStyle = f.color;
      const size = f.big ? 22 : 16;
      ctx.font = `700 ${size}px ${this.fontFamily}`;
      let txt = "";
      if (f.kind === "score" || f.kind === "rp") txt = `+${faNum(f.n === undefined ? (f.kind === "rp" ? 1 : 0) : f.n, this.lang)}`;
      else txt = (S.toasts && S.toasts[f.key]) || "";
      ctx.shadowColor = "rgba(0,0,0,0.6)";
      ctx.shadowBlur = 6;
      ctx.fillText(txt, f.x, y);
      ctx.shadowBlur = 0;
    }
    ctx.globalAlpha = 1;

    /* migration aiming mode */
    if (this.aiming) {
      ctx.setLineDash([6, 7]);
      ctx.strokeStyle = "rgba(127, 232, 196, 0.7)";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(this.cell.x, this.cell.y);
      ctx.lineTo(this.pointer.x, this.pointer.y);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.arc(this.pointer.x, this.pointer.y, 14 + Math.sin(t * 6) * 3, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = "rgba(127, 232, 196, 0.9)";
      ctx.font = `600 13px ${this.fontFamily}`;
      ctx.fillText(S.hud.aim, this.pointer.x, this.pointer.y - 26);
    }

    /* fail flash */
    if (this.failFlash > 0) {
      const vg = ctx.createRadialGradient(this.W / 2, this.H / 2, this.H * 0.3, this.W / 2, this.H / 2, this.H * 0.75);
      vg.addColorStop(0, "rgba(0,0,0,0)");
      vg.addColorStop(1, `rgba(228, 106, 106, ${this.failFlash * 0.35})`);
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, this.W, this.H);
    }
    /* vignette */
    const vg2 = ctx.createRadialGradient(this.W / 2, this.H / 2, this.H * 0.35, this.W / 2, this.H / 2, this.H * 0.85);
    vg2.addColorStop(0, "rgba(0,0,0,0)");
    vg2.addColorStop(1, "rgba(2, 4, 8, 0.55)");
    ctx.fillStyle = vg2;
    ctx.fillRect(0, 0, this.W, this.H);

    ctx.restore();
  }

  buildEcm() {
    const c = document.createElement("canvas");
    c.width = Math.max(320, Math.floor(this.W));
    c.height = Math.max(420, Math.floor(this.H));
    const x = c.getContext("2d");
    if (!x) return;
    /* collagen fibers */
    for (let i = 0; i < 11; i++) {
      const y0 = Math.random() * c.height;
      const x0 = Math.random() * c.width;
      x.strokeStyle = `rgba(124, 141, 176, ${0.05 + Math.random() * 0.05})`;
      x.lineWidth = 0.8 + Math.random() * 1.6;
      x.beginPath();
      x.moveTo(x0, y0);
      const segs = 3 + Math.floor(Math.random() * 3);
      for (let s = 1; s <= segs; s++) {
        x.bezierCurveTo(
          x0 + (Math.random() - 0.5) * 160 * s * 0.3,
          y0 + (Math.random() - 0.5) * 120 * s * 0.3,
          x0 + (Math.random() - 0.5) * 160 * s * 0.5,
          y0 + 120 * s * (0.4 + Math.random() * 0.5),
          x0 + (Math.random() - 0.5) * 220,
          y0 + 90 * s * (0.5 + Math.random() * 0.6),
        );
      }
      x.stroke();
    }
    /* proteoglycan nodes */
    for (let i = 0; i < 40; i++) {
      const px = Math.random() * c.width;
      const py = Math.random() * c.height;
      x.fillStyle = "rgba(139, 152, 180, 0.08)";
      x.beginPath();
      x.arc(px, py, 1.5 + Math.random() * 2, 0, Math.PI * 2);
      x.fill();
    }
    this.ecmCanvas = c;
  }

  drawTarget(ctx, tg, t) {
    const appear = tg.state === "incoming" ? _clamp(tg.stateT / 0.5, 0, 1) : 1;
    const leaving = tg.state === "satisfied" || tg.state === "failed";
    const leaveF = leaving ? _clamp(tg.stateT / 0.8, 0, 1) : 0;
    const scale = appear * (1 - leaveF * 0.9);
    if (scale <= 0.02) return;
    const alpha = appear * (1 - leaveF);
    const pulse = tg.state === "active" && tg.patience < 0.25 ? 1 + Math.sin(t * 9) * 0.05 : 1;
    const R = tg.r * scale * pulse;
    ctx.save();
    ctx.globalAlpha = alpha;
    /* target cell body */
    const bg = ctx.createRadialGradient(tg.x - R * 0.3, tg.y - R * 0.3, R * 0.2, tg.x, tg.y, R);
    bg.addColorStop(0, "rgba(43, 66, 110, 0.95)");
    bg.addColorStop(1, "rgba(16, 28, 50, 0.92)");
    ctx.fillStyle = bg;
    this.blobPath(ctx, tg.x, tg.y, R, 0.03, t * 0.7 + tg.seed);
    ctx.fill();
    ctx.strokeStyle = tg.state === "failed" ? "rgba(228, 106, 106, 0.8)" : "rgba(139, 158, 196, 0.55)";
    ctx.lineWidth = 1.6;
    ctx.stroke();
    /* nucleus */
    ctx.fillStyle = "rgba(111, 134, 186, 0.5)";
    ctx.beginPath();
    ctx.arc(tg.x + R * 0.18, tg.y + R * 0.1, R * 0.34, 0, Math.PI * 2);
    ctx.fill();
    /* patience ring */
    if (tg.state === "active" || tg.state === "incoming") {
      const ringR = R + 9;
      const col = tg.patience > 0.5 ? "rgba(190, 214, 248, 0.85)" : tg.patience > 0.25 ? "rgba(240, 178, 90, 0.95)" : "rgba(228, 106, 106, 0.95)";
      ctx.strokeStyle = "rgba(255,255,255,0.08)";
      ctx.lineWidth = 3.4;
      ctx.beginPath();
      ctx.arc(tg.x, tg.y, ringR, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = col;
      ctx.lineWidth = 3.4;
      ctx.lineCap = "round";
      ctx.beginPath();
      const st = -Math.PI / 2;
      ctx.arc(tg.x, tg.y, ringR, st, st + Math.PI * 2 * Math.max(0.001, tg.patience));
      ctx.stroke();
      /* pin */
      if (this.pinned === tg.id) {
        ctx.strokeStyle = "rgba(159, 225, 255, 0.9)";
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 4]);
        ctx.lineDashOffset = -t * 20;
        ctx.beginPath();
        ctx.arc(tg.x, tg.y, ringR + 6, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }
    /* demand icon */
    const info2 = { x: tg.x, y: tg.y - R - 20 };
    const dcol = tg.state === "failed" ? "#E46A6A" : tg.state === "satisfied" ? "#7FE8C4" : DEMAND_COLOR[tg.demand];
    this.drawDemandIcon(ctx, tg.demand, info2.x, info2.y, 1 + (tg.patience < 0.25 ? Math.sin(t * 9) * 0.08 : 0), dcol);
    /* double need */
    if (tg.need > 1 && tg.state === "active") {
      for (let i = 0; i < tg.need; i++) {
        ctx.fillStyle = i < tg.deliveredN ? "#7FE8C4" : "rgba(190, 214, 248, 0.7)";
        ctx.beginPath();
        ctx.arc(info2.x - 6 + i * 12, info2.y + 20, 3.2, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    if (tg.state === "satisfied") {
      ctx.fillStyle = "rgba(127, 232, 196, 0.95)";
      ctx.font = `700 ${Math.max(15, R * 0.5)}px ${this.fontFamily}`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("✓", tg.x, tg.y);
    }
    ctx.restore();
  }

  drawDemandIcon(ctx, kind, x, y, s, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    ctx.shadowColor = color;
    ctx.shadowBlur = 7;
    if (kind === "rna") {
      /* RNA hairpin */
      ctx.beginPath();
      ctx.moveTo(-6, 7);
      ctx.lineTo(-6, -3);
      ctx.quadraticCurveTo(-6, -8, 0, -8);
      ctx.quadraticCurveTo(6, -8, 6, -3);
      ctx.lineTo(6, 7);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(-6, 8.5, 1.6, 0, Math.PI * 2);
      ctx.arc(6, 8.5, 1.6, 0, Math.PI * 2);
      ctx.fill();
    } else if (kind === "receptor") {
      /* membrane receptor */
      ctx.beginPath();
      ctx.moveTo(-8, 7);
      ctx.lineTo(8, 7);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, 7);
      ctx.lineTo(0, -1);
      ctx.moveTo(0, -1);
      ctx.lineTo(-4, -6);
      ctx.moveTo(0, -1);
      ctx.lineTo(4, -6);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(0, -8.5, 1.6, 0, Math.PI * 2);
      ctx.fill();
    } else if (kind === "antigen") {
      /* antigen flag */
      ctx.beginPath();
      ctx.moveTo(-4, 8);
      ctx.lineTo(-4, -8);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-4, -8);
      ctx.lineTo(7, -5);
      ctx.lineTo(-4, -2);
      ctx.closePath();
      ctx.fill();
    } else {
      /* growth sprout */
      ctx.beginPath();
      ctx.moveTo(0, 8);
      ctx.quadraticCurveTo(1, 0, 0, -4);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, -1);
      ctx.quadraticCurveTo(-6, -2, -6, -7);
      ctx.quadraticCurveTo(-1, -7, 0, -1);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(0, -4);
      ctx.quadraticCurveTo(5, -5, 5, -9);
      ctx.quadraticCurveTo(1, -9, 0, -4);
      ctx.fill();
    }
    ctx.restore();
  }

  drawTrail(ctx, tr, t) {
    const a = _clamp(tr.life / tr.maxLife, 0, 1);
    ctx.save();
    ctx.globalAlpha = Math.min(1, a * 1.15);
    /* retraction fiber */
    ctx.strokeStyle = "rgba(127, 232, 196, 0.6)";
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 6]);
    ctx.lineDashOffset = -t * 14;
    ctx.beginPath();
    ctx.moveTo(tr.x1, tr.y1);
    ctx.lineTo(tr.x2, tr.y2);
    ctx.stroke();
    ctx.setLineDash([]);
    /* migrasome bulbs (raspberry) */
    for (const b of tr.bulbs) {
      const ba = _clamp(b.life / tr.maxLife, 0, 1);
      ctx.globalAlpha = Math.min(1, a * ba * 1.3);
      const pulse = 1 + Math.sin(t * 4 + b.seed) * 0.1;
      const g = ctx.createRadialGradient(b.x, b.y, 2, b.x, b.y, b.r * pulse);
      g.addColorStop(0, "rgba(127, 232, 196, 0.5)");
      g.addColorStop(1, "rgba(127, 232, 196, 0.08)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r * pulse, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "rgba(127, 232, 196, 0.95)";
      ctx.lineWidth = 1.6;
      ctx.stroke();
      /* raspberry bubbles */
      ctx.fillStyle = "rgba(220, 240, 255, 0.95)";
      for (let i = 0; i < 5; i++) {
        const aa = b.seed + (i / 5) * Math.PI * 2 + t * 0.5;
        ctx.beginPath();
        ctx.arc(b.x + Math.cos(aa) * b.r * 0.55, b.y + Math.sin(aa) * b.r * 0.55, 2.4, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  drawVesicle(ctx, v, t) {
    const info = getPathway(v.kind);
    /* motion trail */
    if (v.trail.length > 2) {
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.strokeStyle = info.color;
      ctx.lineCap = "round";
      for (let i = 1; i < v.trail.length; i++) {
        const a = (i / v.trail.length) * 0.45;
        ctx.globalAlpha = a;
        ctx.lineWidth = (v.r * 0.6 * i) / v.trail.length;
        ctx.beginPath();
        ctx.moveTo(v.trail[i - 1].x, v.trail[i - 1].y);
        ctx.lineTo(v.trail[i].x, v.trail[i].y);
        ctx.stroke();
      }
      ctx.restore();
    }
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    const glow = ctx.createRadialGradient(v.x, v.y, 1, v.x, v.y, v.r * 2.6);
    glow.addColorStop(0, this.rgba(info.color, 0.5));
    glow.addColorStop(1, this.rgba(info.color, 0));
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(v.x, v.y, v.r * 2.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.save();
    if (v.kind === "blebbisome") {
      /* moving wobbling bleb */
      ctx.fillStyle = "rgba(228, 237, 250, 0.14)";
      ctx.strokeStyle = "rgba(228, 237, 250, 0.9)";
      ctx.lineWidth = 2;
      this.blobPath(ctx, v.x, v.y, v.r, 0.22, t * 2.4 + v.seed);
      ctx.fill();
      ctx.stroke();
      /* inner organelles */
      ctx.fillStyle = "rgba(159, 178, 214, 0.8)";
      const orgs = [[-0.35, -0.25, 4], [0.3, -0.3, 3], [0.25, 0.3, 5], [-0.2, 0.35, 3], [0.05, 0.02, 3.5]];
      for (const [ox, oy, or] of orgs) {
        ctx.beginPath();
        ctx.ellipse(
          v.x + ox * v.r + Math.sin(t * 1.5 + v.seed + ox * 9) * 1.5,
          v.y + oy * v.r + Math.cos(t * 1.2 + v.seed + oy * 9) * 1.5,
          or, or * 0.6,
          t * 0.4 + ox * 3, 0, Math.PI * 2,
        );
        ctx.fill();
      }
    } else {
      ctx.fillStyle = this.rgba(info.color, 0.22);
      ctx.strokeStyle = info.color;
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.arc(v.x, v.y, v.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      if (v.kind === "exosome") {
        /* tetraspanins on membrane */
        ctx.fillStyle = info.color;
        for (let i = 0; i < 3; i++) {
          const a = v.seed + (i / 3) * Math.PI * 2 + t * 1.4;
          ctx.beginPath();
          ctx.arc(v.x + Math.cos(a) * v.r, v.y + Math.sin(a) * v.r, 1.7, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      /* inner cargo */
      if (v.cargo !== "generic") {
        ctx.fillStyle = DEMAND_COLOR[v.cargo];
        ctx.beginPath();
        ctx.arc(v.x, v.y, v.r * 0.34, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    /* opsonin tag */
    if (v.tagged) {
      ctx.strokeStyle = "rgba(228, 106, 106, 0.9)";
      ctx.lineWidth = 1.6;
      ctx.setLineDash([4, 4]);
      ctx.lineDashOffset = -t * 14;
      ctx.beginPath();
      ctx.arc(v.x, v.y, v.r + 7, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.restore();
  }

  drawCell(ctx, t, comboCol) {
    const c = this.cell;
    const dyingF = this.dying ? _clamp(this.deathT / 2.4, 0, 1) : 0;
    const R = c.r * (1 - dyingF * 0.55) * (1 + Math.sin(t * 1.8) * 0.02);
    ctx.save();
    /* combo ring */
    if (this.combo >= 2 && !this.dying) {
      const frac = _clamp(this.comboT / 5.2, 0, 1);
      ctx.strokeStyle = comboCol;
      ctx.globalAlpha = 0.7;
      ctx.lineWidth = 2.6;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.arc(c.x, c.y, R + 16, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * frac);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    /* outer halo */
    ctx.globalCompositeOperation = "lighter";
    const og = ctx.createRadialGradient(c.x, c.y, R * 0.6, c.x, c.y, R * 1.8);
    og.addColorStop(0, this.dying ? "rgba(228,106,106,0.22)" : "rgba(111, 214, 255, 0.16)");
    og.addColorStop(1, "rgba(111, 214, 255, 0)");
    ctx.fillStyle = og;
    ctx.beginPath();
    ctx.arc(c.x, c.y, R * 1.8, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalCompositeOperation = "source-over";
    /* membrane */
    const wob = this.dying ? 0.3 : 0.045;
    ctx.fillStyle = "rgba(23, 38, 66, 0.94)";
    ctx.strokeStyle = this.dying ? "rgba(228,106,106,0.85)" : "rgba(159, 200, 255, 0.75)";
    ctx.lineWidth = 2.4;
    this.blobPath(ctx, c.x, c.y, R, wob, t * 1.6);
    ctx.fill();
    ctx.stroke();
    /* nucleus */
    ctx.fillStyle = "rgba(38, 62, 105, 0.95)";
    ctx.beginPath();
    ctx.arc(c.x + R * 0.12, c.y - R * 0.08, R * 0.36, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "rgba(126, 160, 220, 0.8)";
    ctx.beginPath();
    ctx.arc(c.x + R * 0.2, c.y - R * 0.16, R * 0.12, 0, Math.PI * 2);
    ctx.fill();
    /* mitochondria */
    ctx.strokeStyle = "rgba(178, 214, 255, 0.65)";
    ctx.lineWidth = 2.2;
    for (let i = 0; i < 3; i++) {
      const a = t * (0.35 + i * 0.12) + (i / 3) * Math.PI * 2;
      const ox = Math.cos(a) * R * 0.55;
      const oy = Math.sin(a) * R * 0.5;
      ctx.beginPath();
      ctx.ellipse(c.x + ox, c.y + oy, R * 0.16, R * 0.07, a * 1.4, 0, Math.PI * 2);
      ctx.stroke();
    }
    /* ER arcs near membrane */
    ctx.strokeStyle = "rgba(139, 168, 220, 0.4)";
    ctx.lineWidth = 1.2;
    for (let i = 0; i < 4; i++) {
      const a0 = (i / 4) * Math.PI * 2 + t * 0.2;
      ctx.beginPath();
      ctx.arc(c.x, c.y, R * 0.78, a0, a0 + 0.9);
      ctx.stroke();
    }
    /* build bud */
    const b = this.buildQueue[0];
    if (b && !this.dying) {
      const info = getPathway(b.kind);
      const frac = _clamp(b.t / b.dur, 0, 1);
      const tgt = this.targets.find((tt) => tt.id === b.targetId);
      const ang = tgt ? Math.atan2(tgt.y - c.y, tgt.x - c.x) : -Math.PI / 2;
      const bx = c.x + Math.cos(ang) * R * 0.92;
      const by = c.y + Math.sin(ang) * R * 0.92;
      const br = info.radius * 1.35 * frac + 3;
      ctx.save();
      ctx.shadowColor = info.color;
      ctx.shadowBlur = 16;
      ctx.fillStyle = this.rgba(info.color, 0.4);
      ctx.strokeStyle = info.color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(bx, by, br, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
      if (b.kind === "exosome") {
        /* MVB approaching membrane */
        ctx.fillStyle = info.color;
        ctx.globalAlpha = 0.8;
        for (let i = 0; i < 3; i++) {
          const aa = ang + Math.sin(t * 5 + i * 2.1) * 0.3;
          const rr = R * (0.55 + frac * 0.3);
          ctx.beginPath();
          ctx.arc(c.x + Math.cos(aa) * rr, c.y + Math.sin(aa) * rr, 2.2, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }
    }
    /* migration pseudopod */
    if (this.migrating) {
      const m = this.migrating;
      const ang = Math.atan2(m.y2 - m.y1, m.x2 - m.x1);
      ctx.fillStyle = "rgba(127, 232, 196, 0.25)";
      ctx.beginPath();
      ctx.moveTo(c.x + Math.cos(ang - 0.5) * R, c.y + Math.sin(ang - 0.5) * R);
      ctx.quadraticCurveTo(
        c.x + Math.cos(ang) * R * 1.55,
        c.y + Math.sin(ang) * R * 1.55,
        c.x + Math.cos(ang + 0.5) * R,
        c.y + Math.sin(ang + 0.5) * R,
      );
      ctx.fill();
    }
    ctx.restore();
  }

  drawMacro(ctx, m, t) {
    const hunting = m.hunt !== null || m.gulpT > 0;
    ctx.save();
    /* gray body with moving ruffles */
    ctx.fillStyle = hunting ? "rgba(196, 168, 158, 0.88)" : "rgba(174, 182, 198, 0.85)";
    ctx.strokeStyle = hunting ? "rgba(228, 140, 120, 0.8)" : "rgba(200, 208, 224, 0.7)";
    ctx.lineWidth = 2;
    const scale = m.gulpT > 0 ? 1 + Math.sin((0.6 - m.gulpT) * 14) * 0.08 : 1;
    this.blobPath(ctx, m.x, m.y, m.r * scale, 0.16, t * 2 + m.seed, 6);
    ctx.fill();
    ctx.stroke();
    /* dark nucleus */
    ctx.fillStyle = "rgba(70, 80, 100, 0.9)";
    ctx.beginPath();
    ctx.arc(m.x + 3, m.y + 2, m.r * 0.4, 0, Math.PI * 2);
    ctx.fill();
    /* lysosomes */
    ctx.fillStyle = "rgba(140, 110, 110, 0.75)";
    for (let i = 0; i < 4; i++) {
      const a = t * 0.9 + m.seed + (i / 4) * Math.PI * 2;
      ctx.beginPath();
      ctx.arc(m.x + Math.cos(a) * m.r * 0.6, m.y + Math.sin(a) * m.r * 0.6, 2.6, 0, Math.PI * 2);
      ctx.fill();
    }
    /* hunt line */
    if (m.hunt !== null) {
      const v = this.vesicles.find((vv) => vv.id === m.hunt);
      if (v) {
        ctx.strokeStyle = "rgba(228, 106, 106, 0.35)";
        ctx.setLineDash([3, 6]);
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(m.x, m.y);
        ctx.lineTo(v.x, v.y);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }
    ctx.restore();
  }

  drawOpsonin(ctx, o, t) {
    ctx.save();
    ctx.translate(o.x, o.y);
    ctx.rotate(Math.sin(t * 0.8 + o.seed) * 0.6);
    ctx.strokeStyle = "rgba(217, 226, 242, 0.8)";
    ctx.lineWidth = 1.6;
    ctx.lineCap = "round";
    ctx.shadowColor = "rgba(217, 226, 242, 0.8)";
    ctx.shadowBlur = 5;
    ctx.beginPath();
    ctx.moveTo(0, 6);
    ctx.lineTo(0, -2);
    ctx.moveTo(0, -2);
    ctx.lineTo(-4.5, -7);
    ctx.moveTo(0, -2);
    ctx.lineTo(4.5, -7);
    ctx.stroke();
    ctx.restore();
  }

  blobPath(ctx, x, y, r, wobble, phase, points = 22) {
    ctx.beginPath();
    for (let i = 0; i <= points; i++) {
      const a = (i / points) * Math.PI * 2;
      const rr = r * (1 + Math.sin(a * 3 + phase) * wobble + Math.sin(a * 5 - phase * 1.3) * wobble * 0.6);
      const px = x + Math.cos(a) * rr;
      const py = y + Math.sin(a) * rr;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
  }

  rgba(hex, a) {
    const h = hex.replace("#", "");
    const r = parseInt(h.slice(0, 2), 16);
    const g = parseInt(h.slice(2, 4), 16);
    const b = parseInt(h.slice(4, 6), 16);
    return `rgba(${r}, ${g}, ${b}, ${a})`;
  }
}

/* ═══════════ sound engine (WebAudio, no files) ═══════════ */
class SoundFX {
  constructor() {
    this.ctx = null;
    this.musicNodes = null;
    this.muted = false;
    this.musicOn = false;
  }
  unlock() {
    try {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ctx = new AC();
      }
      if (this.ctx.state === "suspended") this.ctx.resume();
      if (this.musicOn) this.startMusic();
    } catch (e) { /* no sound */ }
  }
  tone(freq, dur, type = "sine", gain = 0.1, delay = 0, slideTo) {
    if (this.muted || !this.ctx) return;
    try {
      const t0 = this.ctx.currentTime + delay;
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t0);
      if (slideTo !== undefined) osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(gain, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g).connect(this.ctx.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.05);
    } catch (e) { /* ignore */ }
  }
  noise(dur, gain = 0.06, delay = 0, freq = 800) {
    if (this.muted || !this.ctx) return;
    try {
      const t0 = this.ctx.currentTime + delay;
      const len = Math.floor(this.ctx.sampleRate * dur);
      const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const src = this.ctx.createBufferSource();
      src.buffer = buf;
      const f = this.ctx.createBiquadFilter();
      f.type = "bandpass";
      f.frequency.value = freq;
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(gain, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      src.connect(f).connect(g).connect(this.ctx.destination);
      src.start(t0);
    } catch (e) { /* ignore */ }
  }
  click() { this.tone(660, 0.05, "sine", 0.035); }
  select() { this.tone(880, 0.045, "sine", 0.03); }
  bud(kind) {
    const base = kind === "blebbisome" ? 90 : kind === "exosome" ? 240 : 170;
    this.tone(base, 0.16, "triangle", 0.05, 0, base * 1.6);
    this.noise(0.08, 0.02, 0, 600);
  }
  launch() {
    this.tone(320, 0.14, "sine", 0.06, 0, 640);
    this.noise(0.1, 0.03, 0.02, 1200);
  }
  fuse(combo) {
    const step = Math.min(combo, 8);
    const f = 420 * Math.pow(1.059, step);
    this.tone(f, 0.1, "sine", 0.09);
    this.tone(f * 1.5, 0.12, "sine", 0.05, 0.06);
    this.tone(f * 2, 0.09, "sine", 0.03, 0.11);
  }
  comboFanfare(level) {
    [523, 659, 784, 1046].slice(0, 2 + (level % 3)).forEach((f, i) =>
      this.tone(f * (1 + level * 0.02), 0.12, "triangle", 0.06, i * 0.07));
  }
  invalid() { this.tone(130, 0.09, "square", 0.03); }
  fail() {
    this.tone(220, 0.3, "sawtooth", 0.045, 0, 90);
    this.tone(110, 0.32, "triangle", 0.05, 0.04, 70);
  }
  gulp() {
    this.tone(160, 0.22, "sine", 0.08, 0, 40);
    this.noise(0.18, 0.04, 0.05, 300);
  }
  tag() {
    this.tone(1400, 0.06, "square", 0.03);
    this.tone(1100, 0.07, "square", 0.025, 0.07);
  }
  warn() { this.tone(96, 0.28, "sawtooth", 0.05); }
  phase() {
    [392, 494, 587, 784].forEach((f, i) => this.tone(f, 0.2, "sine", 0.07, i * 0.11));
    this.noise(0.4, 0.015, 0, 500);
  }
  discover() { [523, 659, 784, 1046].forEach((f, i) => this.tone(f, 0.16, "sine", 0.08, i * 0.09)); }
  quest() {
    this.tone(880, 0.08, "sine", 0.05);
    this.tone(1174, 0.1, "sine", 0.05, 0.08);
  }
  labOk() {
    this.tone(784, 0.1, "sine", 0.08);
    this.tone(1046, 0.16, "sine", 0.07, 0.09);
  }
  labBad() {
    this.tone(196, 0.18, "triangle", 0.06);
    this.tone(147, 0.22, "triangle", 0.05, 0.1);
  }
  tick() { this.tone(1200, 0.03, "sine", 0.02); }
  upgrade() { [440, 554, 659, 880].forEach((f, i) => this.tone(f, 0.14, "triangle", 0.06, i * 0.06)); }
  gameOver() {
    [523, 466, 392, 311, 262].forEach((f, i) => this.tone(f, 0.3, "sine", 0.07, i * 0.17));
    this.noise(0.6, 0.02, 0.8, 250);
  }
  startMusic() {
    if (this.muted || !this.ctx || this.musicNodes) return;
    try {
      const ctx = this.ctx;
      const gain = ctx.createGain();
      gain.gain.value = 0.035;
      const filter = ctx.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.value = 600;
      const lfo = ctx.createOscillator();
      const lfoGain = ctx.createGain();
      lfo.frequency.value = 0.07;
      lfoGain.gain.value = 320;
      lfo.connect(lfoGain).connect(filter.frequency);
      const freqs = [110, 164.81, 220, 277.18];
      const oscs = freqs.map((f, i) => {
        const o = ctx.createOscillator();
        o.type = i % 2 === 0 ? "sine" : "triangle";
        o.frequency.value = f * (1 + (i - 1.5) * 0.0012);
        const og = ctx.createGain();
        og.gain.value = i === 0 ? 0.5 : 0.22;
        o.connect(og).connect(filter);
        o.start();
        return o;
      });
      filter.connect(gain).connect(ctx.destination);
      lfo.start();
      this.musicNodes = { osc: oscs, gain, lfo };
    } catch (e) { /* ignore */ }
  }
  stopMusic() {
    if (!this.musicNodes || !this.ctx) return;
    try {
      const { osc, gain, lfo } = this.musicNodes;
      gain.gain.setTargetAtTime(0.0001, this.ctx.currentTime, 0.4);
      const stopAt = this.ctx.currentTime + 1.2;
      osc.forEach((o) => o.stop(stopAt));
      lfo.stop(stopAt);
    } catch (e) { /* ignore */ }
    this.musicNodes = null;
  }
  setMusic(on) {
    this.musicOn = on;
    if (on) this.startMusic();
    else this.stopMusic();
  }
}

/* ═══════════ league mini stages : a tiny live animation inside every rank row ═══════════ */
const LEAGUE_MINIS = { sets: [] };
const LEAGUE_MINI_COUNTS = [13, 10, 8, 6, 4, 3, 2]; /* row 0 grandmaster … row 6 trainee */
function bindLeagueMinis() {
  LEAGUE_MINIS.sets = [];
  document.querySelectorAll("#viewMenu .lg-mini").forEach((cv) => {
    const tier = Math.max(0, Math.min(6, parseInt(cv.dataset.tier || "6", 10)));
    const colors = PATHWAYS.map((p) => p.color);
    const parts = [];
    for (let i = 0; i < (LEAGUE_MINI_COUNTS[tier] || 3); i++) {
      parts.push({
        x: 6 + Math.random() * 50,
        y: 5 + Math.random() * 22,
        a: Math.random() * Math.PI * 2,
        v: 9 + Math.random() * 15,
        turn: (Math.random() - 0.5) * 2.2,
        r: 1.5 + Math.random() * 2.1,
        c: colors[i % colors.length],
      });
    }
    LEAGUE_MINIS.sets.push({ cv, ctx: cv.getContext("2d"), parts, dpr: Math.min(2, window.devicePixelRatio || 1) });
  });
}
function tickLeagueMinis() {
  if (!document.getElementById("viewMenu").classList.contains("on")) return;
  for (const s of LEAGUE_MINIS.sets) {
    if (!s.cv.isConnected || s.cv.clientWidth === 0) continue;
    const w = s.cv.clientWidth, h = s.cv.clientHeight;
    if (s.cv.width !== Math.floor(w * s.dpr)) {
      s.cv.width = Math.floor(w * s.dpr);
      s.cv.height = Math.floor(h * s.dpr);
    }
    s.ctx.setTransform(s.dpr, 0, 0, s.dpr, 0, 0);
    s.ctx.fillStyle = "#04070E";
    s.ctx.fillRect(0, 0, w, h);
    for (const p of s.parts) {
      p.a += p.turn * 0.016;
      p.x += Math.cos(p.a) * p.v * 0.016;
      p.y += Math.sin(p.a) * p.v * 0.016;
      if (p.x < 6) { p.x = 6; p.a = Math.PI - p.a; p.turn = -p.turn; }
      else if (p.x > w - 6) { p.x = w - 6; p.a = Math.PI - p.a; p.turn = -p.turn; }
      if (p.y < 6) { p.y = 6; p.a = -p.a; p.turn = -p.turn; }
      else if (p.y > h - 6) { p.y = h - 6; p.a = -p.a; p.turn = -p.turn; }
      const g = s.ctx.createRadialGradient(p.x, p.y, 0.4, p.x, p.y, p.r * 2.8);
      g.addColorStop(0, p.c + "55");
      g.addColorStop(1, p.c + "00");
      s.ctx.fillStyle = g;
      s.ctx.beginPath();
      s.ctx.arc(p.x, p.y, p.r * 2.8, 0, Math.PI * 2);
      s.ctx.fill();
      s.ctx.beginPath();
      s.ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      s.ctx.fillStyle = p.c;
      s.ctx.fill();
    }
  }
}

/* ═══════════ MENU ═══════════ */
function leagueRows(S) {
  const n = S.ranks.length;
  const curIdx = S.ranks.reduce((acc, r, i) => (STATE.highScore >= r.min ? i : acc), 0);
  const rows = [...S.ranks].reverse().map((r, i) => {
    const isYou = n - 1 - i === curIdx;
    const medal = i === 0 ? "lg-gold" : i === 1 ? "lg-silver" : i === 2 ? "lg-bronze" : "";
    const pts = (i === 0 ? faNum(r.min, STATE.lang) + "+" : faNum(r.min, STATE.lang));
    return `<tr class="${medal}${isYou ? " you" : ""}">
      <td class="pos"><span class="lg-badge tnum">${faNum(i + 1, STATE.lang)}</span></td>
      <td class="mini"><canvas class="lg-mini" data-tier="${i}" aria-hidden="true"></canvas></td>
      <td class="nm">${r.label}${isYou ? `<span class="you-tag">${S.menu.leagueYou}</span>` : ""}</td>
      <td class="pts tnum">${pts}</td>
    </tr>`;
  }).join("");
  const next = S.ranks[curIdx + 1] || null;
  let foot;
  if (STATE.highScore > 0 && !next)
    foot = `${S.menu.leagueRecord}: <b class="tnum">${faNum(STATE.highScore, STATE.lang)}</b> · ${S.menu.leagueTop}`;
  else if (STATE.highScore > 0)
    foot = `${S.menu.leagueRecord}: <b class="tnum">${faNum(STATE.highScore, STATE.lang)}</b><br><span class="next">${S.menu.leagueNext}: <b class="tnum">${faNum(next.min - STATE.highScore, STATE.lang)}</b> ${S.menu.leaguePtsUnit}</span>`;
  else foot = S.menu.leagueNoRecord;
  return { rows, foot, curRank: S.ranks[curIdx].label };
}
