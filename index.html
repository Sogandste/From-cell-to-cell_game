/* ambient canvas: the four vesicle families, many circles always moving */
const MENU_FX = { raf: 0 };
function startMenuAmbient() {
  const cv = document.getElementById("menuCanvas");
  const ctx = cv.getContext("2d");
  if (!ctx) return;
  let W = 0, H = 0;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const resize = () => {
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = Math.floor(W * dpr); cv.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  };
  resize();
  window.addEventListener("resize", resize);
  /* one population per vesicle family : several circles of each, all moving at once */
  const SPEC = [
    { kind: "exosome", n: 8, rMin: 4, rMax: 7, vMin: 9, vMax: 16 },
    { kind: "ectosome", n: 6, rMin: 9, rMax: 13, vMin: 11, vMax: 20 },
    { kind: "migrasome", n: 3, rMin: 13, rMax: 18, vMin: 14, vMax: 24 },
    { kind: "blebbisome", n: 2, rMin: 24, rMax: 34, vMin: 3, vMax: 7 },
  ];
  const floaters = [];
  for (const sp of SPEC) {
    const pw = getPathway(sp.kind);
    for (let i = 0; i < sp.n; i++) {
      const f = {
        kind: sp.kind, color: pw.color,
        label: sp.kind === "migrasome" || sp.kind === "blebbisome",
        x: Math.random() * (W || 800), y: Math.random() * (H || 600),
        a: Math.random() * Math.PI * 2,
        v: sp.vMin + Math.random() * (sp.vMax - sp.vMin),
        turn: (Math.random() - 0.5) * 0.22,
        r: sp.rMin + Math.random() * (sp.rMax - sp.rMin),
        seed: Math.random() * 100,
        trail: [], dots: [],
      };
      if (sp.kind === "migrasome") {
        const nd = 5 + Math.floor(Math.random() * 3);
        for (let d = 0; d < nd; d++)
          f.dots.push({ a: Math.random() * Math.PI * 2, d: 0.15 + Math.random() * 0.5, s: 0.09 + Math.random() * 0.08 });
      }
      if (sp.kind === "blebbisome") {
        const nd = 3 + Math.floor(Math.random() * 2);
        for (let d = 0; d < nd; d++)
          f.dots.push({ a: Math.random() * Math.PI * 2, d: 0.15 + Math.random() * 0.45, s: 0.1 + Math.random() * 0.09 });
      }
      floaters.push(f);
    }
  }
  const specks = Array.from({ length: 40 }, () => ({
    x: Math.random() * 800,
    y: Math.random() * 600,
    r: 0.6 + Math.random() * 1.4,
    a: 0.06 + Math.random() * 0.13,
  }));
  let t = 0, liveTick = 0;

  /* per family rendering, faithful to each biogenesis identity */
  function drawFloater(f) {
    const c = f.color;
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    const gl = ctx.createRadialGradient(f.x, f.y, 1, f.x, f.y, f.r * 2.2);
    gl.addColorStop(0, `${c}44`);
    gl.addColorStop(1, `${c}00`);
    ctx.fillStyle = gl;
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.r * 2.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    if (f.kind === "blebbisome") {
      /* organelle rich giant : actively blebbing blob, no nucleus */
      const R = f.r * (1 + 0.05 * Math.sin(t * 0.9 + f.seed));
      ctx.beginPath();
      for (let i = 0; i <= 22; i++) {
        const a = (i / 22) * Math.PI * 2;
        const rr = R * (1 + Math.sin(a * 3 + t * 1.6 + f.seed) * 0.07 + Math.sin(a * 5 - t * 1.1) * 0.04);
        const px = f.x + Math.cos(a) * rr, py = f.y + Math.sin(a) * rr;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fillStyle = `${c}1E`;
      ctx.strokeStyle = `${c}AA`;
      ctx.lineWidth = 1.5;
      ctx.fill();
      ctx.stroke();
      for (const d of f.dots) {
        const da = d.a + t * 0.25;
        const dx = f.x + Math.cos(da) * R * d.d, dy = f.y + Math.sin(da) * R * d.d;
        ctx.beginPath();
        ctx.ellipse(dx, dy, f.r * d.s, f.r * d.s * 0.75, da, 0, Math.PI * 2);
        ctx.fillStyle = `${c}50`;
        ctx.fill();
        ctx.strokeStyle = `${c}99`;
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    } else if (f.kind === "migrasome") {
      /* raspberry pouch riding its retraction fiber */
      if (f.trail.length > 3) {
        ctx.save();
        ctx.setLineDash([2, 5]);
        ctx.strokeStyle = `${c}55`;
        ctx.lineWidth = 1.1;
        ctx.beginPath();
        ctx.moveTo(f.trail[0][0], f.trail[0][1]);
        for (let i = 1; i < f.trail.length; i++) ctx.lineTo(f.trail[i][0], f.trail[i][1]);
        ctx.stroke();
        ctx.setLineDash([]);
        for (const k of [0.35, 0.7]) {
          const p = f.trail[Math.floor(f.trail.length * k)];
          if (p) {
            ctx.beginPath();
            ctx.arc(p[0], p[1], 1.8, 0, Math.PI * 2);
            ctx.fillStyle = `${c}88`;
            ctx.fill();
          }
        }
        ctx.restore();
      }
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      ctx.fillStyle = `${c}22`;
      ctx.strokeStyle = `${c}CC`;
      ctx.lineWidth = 1.4;
      ctx.fill();
      ctx.stroke();
      for (const d of f.dots) {
        const da = d.a + t * 0.5;
        ctx.beginPath();
        ctx.arc(f.x + Math.cos(da) * f.r * d.d, f.y + Math.sin(da) * f.r * d.d, Math.max(1.2, f.r * d.s), 0, Math.PI * 2);
        ctx.fillStyle = `${c}AA`;
        ctx.fill();
      }
    } else if (f.kind === "ectosome") {
      /* microvesicle : vesicle budding straight off the membrane */
      const bud = f.r * 0.42;
      const ba = f.seed + t * 0.6;
      const bx = f.x + Math.cos(ba) * (f.r + bud * 0.8);
      const by = f.y + Math.sin(ba) * (f.r + bud * 0.8);
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      ctx.fillStyle = `${c}22`;
      ctx.strokeStyle = `${c}CC`;
      ctx.lineWidth = 1.5;
      ctx.fill();
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(bx, by, bud, 0, Math.PI * 2);
      ctx.fillStyle = `${c}30`;
      ctx.fill();
      ctx.strokeStyle = `${c}CC`;
      ctx.lineWidth = 1.2;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r * 0.28, 0, Math.PI * 2);
      ctx.fillStyle = `${c}70`;
      ctx.fill();
    } else {
      /* exosome : small endosomal vesicle with satellites and a faint halo */
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      ctx.fillStyle = `${c}33`;
      ctx.strokeStyle = `${c}DD`;
      ctx.lineWidth = 1.3;
      ctx.fill();
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r * 0.35, 0, Math.PI * 2);
      ctx.fillStyle = c;
      ctx.fill();
      ctx.save();
      ctx.setLineDash([2, 4]);
      ctx.strokeStyle = `${c}55`;
      ctx.lineWidth = 0.9;
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r * 1.7, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
      for (let i = 0; i < 3; i++) {
        const a = f.seed + (i / 3) * Math.PI * 2 + t * 0.9;
        ctx.beginPath();
        ctx.arc(f.x + Math.cos(a) * f.r * 1.7, f.y + Math.sin(a) * f.r * 1.7, 1.3, 0, Math.PI * 2);
        ctx.fillStyle = `${c}CC`;
        ctx.fill();
      }
    }

    /* name labels under the two large families : a dark pill with a hairline
       border keeps them readable over any glow; flips above the vesicle when
       close to the bottom edge, and stays inside the panel horizontally */
    if (f.label) {
      const name = getPathway(f.kind).name[STATE.lang].split(" · ")[0];
      ctx.font = "11px Vazirmatn, sans-serif";
      ctx.textAlign = "center";
      const tw = ctx.measureText(name).width;
      let lx = f.x, ly = f.y + f.r + 17;
      if (ly + 10 > H) ly = f.y - f.r - 9;
      const pw = tw + 15, ph = 19;
      /* clamp the whole pill inside the canvas so it can never clip */
      const rx = Math.max(2, Math.min(W - pw - 2, lx - pw / 2));
      const ry = Math.max(2, Math.min(H - ph - 2, ly - 13));
      ctx.fillStyle = "rgba(4,8,16,.82)";
      ctx.strokeStyle = "rgba(148,163,184,.30)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(rx, ry, pw, ph, 9);
      else ctx.rect(rx, ry, pw, ph);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "rgba(220,232,246,.92)";
      ctx.fillText(name, rx + pw / 2, ry + 13.5);
    }
  }

  const loop = () => {
    MENU_FX.raf = requestAnimationFrame(loop);
    /* the stage and the league mini stages only draw while the menu is on screen */
    if (!document.getElementById("viewMenu").classList.contains("on")) return;
    if (cv.clientWidth > 0 && (cv.clientWidth !== W || cv.clientHeight !== H)) resize();
    t += 0.016;
    tickLeagueMinis();
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#04070E");
    g.addColorStop(1, "#0B1A30");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    for (const s of specks) {
      ctx.fillStyle = `rgba(139,152,180,${s.a})`;
      ctx.beginPath();
      ctx.arc((s.x + t * 4) % W, (s.y + Math.sin(t * 0.3 + s.r * 9) * 8 + H) % H, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    for (const f of floaters) {
      f.a += f.turn * 0.016 + Math.sin(t * 0.7 + f.seed) * 0.012;
      f.x += Math.cos(f.a) * f.v * 0.016;
      f.y += Math.sin(f.a) * f.v * 0.016;
      /* fenced stage : vesicles softly bounce off the panel edges, never clipped.
         The margin equals the glow radius (2.2r), so cores, buds, haloes,
         satellites, trails and glows all stay fully inside the panel. */
      const m = Math.min(f.r * 2.2, W / 2 - 1, H / 2 - 1);
      if (f.x < m) { f.x = m; f.a = Math.PI - f.a; f.turn = -f.turn; f.a += (Math.random() - 0.5) * 0.4; }
      else if (f.x > W - m) { f.x = W - m; f.a = Math.PI - f.a; f.turn = -f.turn; f.a += (Math.random() - 0.5) * 0.4; }
      if (f.y < m) { f.y = m; f.a = -f.a; f.turn = -f.turn; f.a += (Math.random() - 0.5) * 0.4; }
      else if (f.y > H - m) { f.y = H - m; f.a = -f.a; f.turn = -f.turn; f.a += (Math.random() - 0.5) * 0.4; }
      if (f.kind === "migrasome") {
        f.trail.push([f.x, f.y]);
        if (f.trail.length > 30) f.trail.shift();
      }
    }
    /* big families behind, small ones on top */
    const order = { blebbisome: 0, migrasome: 1, ectosome: 2, exosome: 3 };
    for (const f of [...floaters].sort((a, b) => order[a.kind] - order[b.kind])) drawFloater(f);
    /* live counter, twice a second */
    liveTick += 1;
    if (liveTick % 30 === 0) {
      const el = document.getElementById("stageLive");
      if (el) el.textContent = faNum(floaters.length, STATE.lang) + " " + STR[STATE.lang].menu.stageLiveUnit;
    }
  };
  loop();
  MENU_FX.stop = () => {
    cancelAnimationFrame(MENU_FX.raf);
    window.removeEventListener("resize", resize);
  };
}

/* ═══════════ GAME HOST ═══════════ */
let GAME = null;

function startRun() {
  if (GAME) GAME.destroy();
  STATE.runId++;
  STATE.screen = "game";
  showView("game");
  GAME = new GameHost();
}

class GameHost {
  constructor() {
    this.S = STR[STATE.lang];
    this.quizBag = [];
    this.toastId = 1;
    this.toasts = [];
    this.hud = null;
    this.discovery = null;
    this.labCheck = null;
    this.shopOpen = false;
    this.shopTiers = {};
    this.shopRp = 0;
    this.manualPause = false;
    this.over = null;
    this.isNewRecord = false;
    this.tutorial = null;
    this.banner = { n: 1, show: false };
    this.bannerT = 0;
    this.destroyed = false;

    this.engine = new EvEngine({
      onToast: (key, tone) => this.pushToast(key, tone),
      onDiscovery: (kind) => { this.discovery = kind; this.renderModal(); sfx.discover(); },
      onLabCheck: () => {
        if (this.quizBag.length === 0) this.quizBag = QUIZ_BANK.map((_, i) => i).sort(() => Math.random() - 0.5);
        const idx = this.quizBag.pop();
        const seconds = 12 * (1 + 0.5 * (this.engine.getUpgrades().misev ?? 0));
        if (idx !== undefined) this.labCheck = { q: QUIZ_BANK[idx], seconds };
        this.renderModal();
        sfx.quest();
      },
      onPhaseClear: () => {
        this.shopTiers = this.engine.getUpgrades();
        this.shopRp = this.engine.getHud().rp;
        this.shopOpen = true;
        this.renderModal();
        sfx.phase();
      },
      onGameOver: (s) => {
        this.over = s;
        this.isNewRecord = s.score > STATE.highScore;
        if (s.score > STATE.highScore) {
          STATE.highScore = s.score;
          lsSet("ev-highscore", String(s.score));
        }
        this.renderModal();
      },
      onSfx: (name) => {
        if (name === "bud") sfx.bud("exosome");
        else if (name === "launch") sfx.launch();
        else if (name === "fuse") sfx.fuse(this.engine.getHud().combo);
        else if (name === "fail") sfx.fail();
        else if (name === "gulp") sfx.gulp();
        else if (name === "tag") sfx.tag();
        else if (name === "gameover") sfx.gameOver();
      },
    });
    this.engine.setLang(STATE.lang);
    this.engine.setFont(this.fontStack());

    this.canvas = document.getElementById("gameCanvas");
    this.ctx = this.canvas.getContext("2d");
    const wrap = document.getElementById("viewGame");
    this.wrap = wrap;

    this.dpr = Math.min(2, window.devicePixelRatio || 1);
    this.resize = () => {
      const w = wrap.clientWidth;
      const h = wrap.clientHeight;
      this.canvas.width = Math.floor(w * this.dpr);
      this.canvas.height = Math.floor(h * this.dpr);
      this.canvas.style.width = w + "px";
      this.canvas.style.height = h + "px";
      this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
      this.engine.resize(w, h);
    };
    this.resize();
    this.ro = window.ResizeObserver ? new ResizeObserver(this.resize) : null;
    if (this.ro) this.ro.observe(wrap);
    window.addEventListener("resize", this.resize);

    let last = performance.now();
    this.raf = 0;
    const loop = (now) => {
      if (this.destroyed) return;
      this.raf = requestAnimationFrame(loop);
      const dt = (now - last) / 1000;
      last = now;
      this.engine.update(dt);
      this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
      this.engine.draw(this.ctx);
    };
    this.raf = requestAnimationFrame(loop);

    /* HUD polling */
    this.hudIv = setInterval(() => {
      if (this.destroyed) return;
      if (this.engine.isRunning() || this.engine.getHud().dying) {
        this.hud = this.engine.getHud();
        this.updateHud();
      }
    }, 140);

    /* input */
    this.onKeyDown = (e) => {
      if (this.destroyed) return;
      if (e.repeat) return;
      const k = e.key;
      if (["1", "2", "3", "4"].includes(k) && !this.modalOpen() && !STATE.guideOpen) {
        this.launch(["exosome", "ectosome", "blebbisome", "migrasome"][+k - 1]);
      } else if (k === " " || k === "p" || k === "P") {
        e.preventDefault();
        if (!this.modalOpen() && !STATE.guideOpen && !this.over) {
          this.manualPause = !this.manualPause;
          this.renderModal();
        }
      } else if (k === "Escape") {
        if (this.manualPause) { this.manualPause = false; this.renderModal(); }
      }
    };
    window.addEventListener("keydown", this.onKeyDown);

    this.onPointerDown = (ev) => {
      const rect = this.canvas.getBoundingClientRect();
      this.engine.pointerDown(ev.clientX - rect.left, ev.clientY - rect.top);
      if (this.hud) this.updateHud();
    };
    this.onPointerMove = (ev) => {
      const rect = this.canvas.getBoundingClientRect();
      this.engine.pointerMove(ev.clientX - rect.left, ev.clientY - rect.top);
    };
    this.canvas.addEventListener("pointerdown", this.onPointerDown);
    this.canvas.addEventListener("pointermove", this.onPointerMove);

    /* boot */
    this.renderHudSkeleton();
    this.engine.start();
    this.bannerT = setTimeout(() => this.showBanner(1), 120);
    if (!lsGet("ev-tut-done")) this.tutT = setTimeout(() => { this.tutorial = 0; this.renderModal(); }, 800);

    this.modalObserver = setInterval(() => {
      /* keep engine pause in sync with modals / guide */
      const mOpen = this.modalOpen();
      this.engine.paused = mOpen || STATE.guideOpen;
      if (mOpen && this.labCheck) this.labTick();
    }, 120);
    this.labTickIv = null;
  }

  fontStack() {
    return STATE.lang === "fa"
      ? '"Vazirmatn","Segoe UI",Tahoma,sans-serif'
      : '"Space Grotesk","Vazirmatn","Segoe UI",sans-serif';
  }

  modalOpen() {
    return this.discovery !== null || this.labCheck !== null || this.shopOpen || this.manualPause || this.over !== null || this.tutorial !== null;
  }

  launch(kind) {
    const ok = this.engine.launch(kind);
    if (ok) {
      if (kind === "migrasome") sfx.select();
      this.hud = this.engine.getHud();
      this.updateHud();
    }
  }

  showBanner(n) {
    this.banner = { n, show: true };
    this.renderBanner();
    clearTimeout(this.bannerT);
    this.bannerT = setTimeout(() => { this.banner.show = false; this.renderBanner(); }, 2300);
  }

  pushToast(key, tone) {
    this.toasts.push({ id: this.toastId++, key, tone });
    if (tone === "good") {
      if (key === "combo5") sfx.comboFanfare(5);
      else if (key === "combo10") sfx.comboFanfare(10);
      else sfx.quest();
    } else if (tone === "info") {
      sfx.select();
    } else if (!["failed", "engulfed", "tagged"].includes(key)) {
      sfx.invalid();
    }
    this.renderToasts();
    const id = this.toastId - 1;
    setTimeout(() => this.removeToast(id), 3600);
  }
  removeToast(id) {
    this.toasts = this.toasts.filter((t) => t.id !== id);
    this.renderToasts();
  }
  renderToasts() {
    const S = STR[STATE.lang];
    const el = document.getElementById("toastStack");
    el.innerHTML = this.toasts.slice(-4).map((t) => {
      const tone = t.tone === "good" ? "good" : t.tone === "warn" ? "warn" : "info";
      const ic = t.tone === "good" ? icon("sparkles", 14) : t.tone === "warn" ? icon("alert", 14) : icon("info", 14);
      const txt = (S.toasts && S.toasts[t.key]) || t.key;
      return `<div class="toast ${tone}" id="toast${t.id}">${ic}<span>${txt}</span></div>`;
    }).join("");
  }

  renderBanner() {
    const S = STR[STATE.lang];
    const el = document.getElementById("phaseBanner");
    if (!this.banner.show) { el.classList.remove("on"); el.innerHTML = ""; return; }
    const names = S.phases.names;
    const n = this.banner.n;
    const name = n <= names.length ? names[n - 1] : `${names[names.length - 1]} +${faNum(n - names.length, STATE.lang)}`;
    el.innerHTML = `
      <div class="pb-dim"></div>
      <div class="pb-box">
        <div class="ev-phase-sweep"></div>
        <div class="k">${S.phases.banner}</div>
        <div class="n">${faNum(n, STATE.lang)}</div>
        <div class="nm">${name}</div>
      </div>`;
    el.classList.add("on");
  }

  /* ---------- HUD ---------- */
  renderHudSkeleton() {
    const S = STR[STATE.lang];
    document.getElementById("topbar").innerHTML = `
      <div class="ev-glass tb-score">
        <div class="lbl">${S.hud.score}</div>
        <div class="val tnum" id="hudScore">0</div>
        <div class="tb-comborow" id="comboRow"></div>
      </div>
      <div class="ev-glass tb-phase">
        <div class="lbl">${S.hud.phase}</div>
        <div class="val" id="hudPhase"></div>
        <div class="bar"><i id="hudPhaseBar"></i></div>
      </div>
      <div class="tb-right">
        <div class="ev-glass tb-vital">
          <div class="row"><span class="lbl">${S.hud.vitality}</span><span class="val tnum" id="hudVital"></span></div>
          <div class="bar"><i id="hudVitalBar"></i></div>
        </div>
        <div class="ev-glass tb-rp">${icon("flask", 14)}<span class="val tnum" id="hudRp">0</span></div>
        <div class="ev-glass tb-ctl">
          <button class="ev-iconbtn" id="gLang" title="${S.common.language}">${icon("lang")}</button>
          <button class="ev-iconbtn" id="gSfx">${STATE.soundOn ? icon("vol") : icon("volx")}</button>
          <button class="ev-iconbtn m-ctl-music" id="gMusic">${icon("music", 16)}</button>
          <button class="ev-iconbtn" id="gGuide">${icon("book")}</button>
          <button class="ev-iconbtn" id="gPause">${icon("pause")}</button>
        </div>
      </div>`;
    document.getElementById("bottombar").innerHTML = `
      <div class="bb-inner">
        <div class="ev-glass bb-res">
          <div class="bb-atp">
            <span class="ev-atp-glyph"></span>
            <div style="flex:1">
              <div class="head"><span class="lbl">${S.hud.atp}</span><span class="tnum" id="hudAtpTxt"></span></div>
              <div class="bar"><i id="hudAtpBar"></i></div>
            </div>
          </div>
          <div class="bb-sep"></div>
          <div class="bb-cargo" id="hudCargo"></div>
        </div>
        <div class="bb-paths" id="hudPaths">
          ${PATHWAYS.map((pw) => `
            <button class="ev-pathbtn" data-kind="${pw.kind}" aria-label="${pw.name[STATE.lang]}">
              <span class="pb-key">${pw.hotkey}</span>
              <span class="pb-glyph">${pathwayGlyph(pw.kind, 30, pw.color)}</span>
              <span class="pb-name">${pw.name[STATE.lang].split(" · ")[0]}</span>
              <span class="pb-cost"><span class="ev-atp-glyph ev-atp-glyph-sm"></span>${faNum(pw.atpCost, STATE.lang)}</span>
              <span class="pb-fill" id="fill_${pw.kind}"></span>
              <span class="ev-build-badge tnum" id="badge_${pw.kind}"></span>
            </button>`).join("")}
        </div>
        <div class="bb-pin">${S.hud.tapToPin}</div>
      </div>`;
    PATHWAYS.forEach((pw) => {
      document.querySelector(`.ev-pathbtn[data-kind="${pw.kind}"]`).style.borderColor = `${pw.color}44`;
    });
    document.getElementById("hudPaths").querySelectorAll(".ev-pathbtn").forEach((btn) => {
      btn.addEventListener("click", () => this.launch(btn.dataset.kind));
    });
    document.getElementById("gLang").addEventListener("click", () => { sfx.unlock(); sfx.click(); toggleLang(); });
    document.getElementById("gSfx").addEventListener("click", () => { sfx.unlock(); toggleSound(); });
    document.getElementById("gMusic").addEventListener("click", () => { sfx.unlock(); toggleMusic(); });
    document.getElementById("gGuide").addEventListener("click", () => { sfx.unlock(); sfx.click(); STATE.guideReturn = "game"; openGuide(); });
    document.getElementById("gPause").addEventListener("click", () => { sfx.click(); this.manualPause = true; this.renderModal(); });
  }

  updateHud() {
    const hud = this.hud;
    if (!hud) return;
    const lang = STATE.lang;
    document.getElementById("hudScore").textContent = faNum(hud.score, lang);
    /* combo row */
    const cr = document.getElementById("comboRow");
    if (hud.combo >= 2) {
      cr.innerHTML = `<div class="tb-combo"><span class="ev-combo-chip" style="color:${hud.combo >= 5 ? "#9BE1FF" : "#C7D6FF"}">${STR[lang].hud.combo} ×${faNum(hud.combo, lang)}</span><span class="bar"><i style="width:${hud.comboFrac * 100}%"></i></span></div>`;
    } else cr.innerHTML = "";
    /* phase */
    const names = STR[lang].phases.names;
    const pname = hud.phase <= names.length ? names[hud.phase - 1] : `${names[names.length - 1]} +${faNum(hud.phase - names.length, lang)}`;
    document.getElementById("hudPhase").textContent = `${faNum(hud.phase, lang)} · ${pname}`;
    document.getElementById("hudPhaseBar").style.width = `${hud.phaseFrac * 100}%`;
    /* vitality */
    const vcol = hud.vitality > 50 ? "#7FE8C4" : hud.vitality > 25 ? "#F0B25A" : "#E46A6A";
    const hv = document.getElementById("hudVital");
    hv.textContent = faNum(hud.vitality, lang);
    hv.style.color = vcol;
    const vb = document.getElementById("hudVitalBar");
    vb.style.width = `${hud.vitality}%`;
    vb.style.background = vcol;
    /* rp */
    document.getElementById("hudRp").textContent = faNum(hud.rp, lang);
    /* atp */
    document.getElementById("hudAtpTxt").textContent = `${faNum(hud.atp, lang)}/${faNum(hud.atpMax, lang)}`;
    document.getElementById("hudAtpBar").style.width = `${(hud.atp / hud.atpMax) * 100}%`;
    /* cargo */
    document.getElementById("hudCargo").innerHTML = DEMANDS.map((d) => {
      const stock = hud.cargo[d.kind];
      const dots = Array.from({ length: hud.cargoMax }, (_, i) =>
        `<span class="dot" style="background:${d.color};opacity:${i < stock ? 0.95 : 0.18}"></span>`).join("");
      return `<div class="cg" title="${d.name[lang]}">${demandGlyph(d.kind, 15, d.color)}<span class="dots">${dots}</span></div>`;
    }).join("");
    /* path buttons */
    document.querySelectorAll("#hudPaths .ev-pathbtn").forEach((btn) => {
      const kind = btn.dataset.kind;
      const pw = getPathway(kind);
      const b = hud.building.find((x) => x.kind === kind);
      btn.style.opacity = hud.atp >= pw.atpCost ? 1 : 0.45;
      btn.classList.toggle("ev-pathbtn-aim", kind === "migrasome" && hud.aiming);
      const fill = document.getElementById("fill_" + kind);
      const badge = document.getElementById("badge_" + kind);
      if (b) {
        fill.style.height = `${b.frac * 100}%`;
        fill.style.background = `${pw.color}22`;
        badge.textContent = `${faNum(Math.round(b.frac * 100), lang)}%`;
        badge.style.color = pw.color;
      } else { fill.style.height = "0"; badge.textContent = ""; }
    });
    this.canvas.classList.toggle("aiming", !!hud.aiming);
  }

  /* ---------- modals ---------- */
  renderModal() {
    const layer = document.getElementById("modalLayer");
    if (this.tutorial !== null) { layer.innerHTML = this.tutorialHtml(); this.wireTutorial(); return; }
    if (this.discovery !== null) { layer.innerHTML = this.discoveryHtml(); this.wireDiscovery(); return; }
    if (this.labCheck !== null) { layer.innerHTML = this.labHtml(); this.wireLab(); return; }
    if (this.shopOpen) { layer.innerHTML = this.shopHtml(); this.wireShop(); return; }
    if (this.manualPause && !this.over) { layer.innerHTML = this.pauseHtml(); this.wirePause(); return; }
    if (this.over !== null) { layer.innerHTML = this.summaryHtml(); this.wireSummary(); return; }
    layer.innerHTML = "";
  }

  tutorialHtml() {
    const S = STR[STATE.lang];
    const steps = S.tutorial;
    const step = this.tutorial;
    const last = step >= steps.length - 1;
    return `<div class="ev-modal-overlay"><div class="ev-modal modal-pad" style="max-width:28rem;text-align:center">
      <div class="tut-dots">${steps.map((_, i) => `<i class="${i <= step ? "on" : ""}"></i>`).join("")}</div>
      <h3 class="m-title">${steps[step].title}</h3>
      <p class="tut-body">${steps[step].body}</p>
      <div class="tut-acts">
        <button class="ev-btn-ghost" id="tutSkip">${S.common.skip}</button>
        <button class="ev-btn-primary" id="tutNext">${last ? icon("play", 15) + S.common.start : S.common.next}</button>
      </div>
    </div></div>`;
  }
  wireTutorial() {
    document.getElementById("tutSkip").addEventListener("click", () => {
      sfx.click(); this.tutorial = null; lsSet("ev-tut-done", "1"); this.renderModal();
    });
    document.getElementById("tutNext").addEventListener("click", () => {
      sfx.click();
      const steps = STR[STATE.lang].tutorial;
      if (this.tutorial >= steps.length - 1) { this.tutorial = null; lsSet("ev-tut-done", "1"); }
      else this.tutorial++;
      this.renderModal();
    });
  }

  discoveryHtml() {
    const S = STR[STATE.lang];
    const lang = STATE.lang;
    const others = ["fa", "en", "fr"].filter((x) => x !== lang);

  labTick() {
    if (!this.labCheck || this.labChoice !== null || this.labTimedOut) return;
    const now = performance.now();
    const elapsed = this.labLastT ? Math.min(0.5, (now - this.labLastT) / 1000) : 0;

    this.labLeft = Math.max(0, this.labLeft - elapsed);
    const lt = document.getElementById("labLeft");

    if (lt) lt.textContent = `${faNum(Math.ceil(this.labLeft), STATE.lang)}s`;
    if (lb) lb.style.width = `${(this.labLeft / this.labCheck.seconds) * 100}%`;

    document.querySelectorAll("#labOpts .ev-quiz-opt").forEach((btn) => {
      const pos = +btn.dataset.pos;
      btn.disabled = true;

/* ═══════════ GUIDE ═══════════ */
function sizeRulerSvg(lang, note) {
  const W = 880, H = 210;
  const logMin = Math.log10(8);
  const logMax = Math.log10(40000);
  const xOf = (nm) => 80 + ((Math.log10(nm) - logMin) / (logMax - logMin)) * (W - 180);
  const rOf = (nm) => Math.min(24, 4 + (Math.log10(nm) - 1) * 7.5);
  const rows = [88, 128];
  let out = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  out += `<line x1="60" y1="165" x2="${W - 30}" y2="165" stroke="rgba(139,158,196,0.4)" stroke-width="1.4"/>`;
  [10, 100, 1000, 10000].forEach((nm) => {
    const x = xOf(nm);
    out += `<line x1="${x}" y1="160" x2="${x}" y2="170" stroke="rgba(139,158,196,0.5)" stroke-width="1.4"/>`;
    out += `<text x="${x}" y="186" text-anchor="middle" font-size="11" fill="#8B98B4" font-weight="700" direction="ltr" unicode-bidi="isolate">${nm >= 1000 ? `${nm / 1000} µm` : `${nm} nm`}</text>`;
  });
  out += `<text x="${W - 30}" y="202" text-anchor="end" font-size="9.5" fill="#64748B" direction="ltr" unicode-bidi="isolate">${note}</text>`;
  SIZE_RULER.forEach((e, i) => {
    const x = xOf(e.nm);
    const r = rOf(e.nm);
    const y = rows[i % 2];
    const labelAbove = i % 2 === 0;
    const ly = labelAbove ? y - r - 16 : y + r + 15;
    out += `<line x1="${x}" y1="${labelAbove ? y - r : y + r}" x2="${x}" y2="165" stroke="${e.color}" stroke-width="0.8" opacity="0.3" stroke-dasharray="2 3"/>`;
    out += `<circle cx="${x}" cy="${y}" r="${r}" fill="${e.dashed ? "none" : `${e.color}26`}" stroke="${e.color}" stroke-width="${e.dashed ? 1.2 : 1.8}" ${e.dashed ? 'stroke-dasharray="4 3"' : ""} opacity="${e.dashed ? 0.65 : 1}"/>`;
    if (!e.dashed && e.nm >= 400) {
      out += `<circle cx="${x - r * 0.3}" cy="${y - r * 0.25}" r="${r * 0.14}" fill="${e.color}" opacity="0.5"/>`;
      out += `<circle cx="${x + r * 0.3}" cy="${y + r * 0.2}" r="${r * 0.18}" fill="${e.color}" opacity="0.4"/>`;
    }
    out += `<text x="${x}" y="${ly}" text-anchor="middle" font-size="10.5" fill="${e.color}" font-weight="800" opacity="${e.dashed ? 0.7 : 1}">${e.label[lang]}</text>`;
  });
  out += `</svg>`;
  return out;
}

            <div class="inner">
              <div class="path-head">
                <div><h4>${pw.name[lang]}</h4><div class="sz" style="color:${pw.color}">${pw.size[lang]}</div></div>
                <div class="path-icon" style="border-color:${pw.color}44;background:${pw.color}10;box-shadow:0 0 24px ${pw.color}22">${pathwayGlyph(pw.kind, 30, pw.color)}</div>
              </div>
              <p style="margin-top:12px;font-size:13px;line-height:2;color:var(--ink2)">${pw.origin[lang]}</p>
              <div class="path-markers">
                ${pw.markersPlus.map((m) => `<span class="ev-chip pos">${m}</span>`).join("")}
                ${pw.markersMinus.map((m) => `<span class="ev-chip neg">${m}</span>`).join("")}
              </div>
              <div class="path-misev"><div class="k">${S.discovery.misev}</div><p>${pw.misevNote[lang]}</p></div>
              <div class="path-stats">
                <span>${G.paths.gameStats}</span>
                <span style="display:flex;align-items:center;gap:4px"><span class="ev-atp-glyph ev-atp-glyph-sm"></span>${G.paths.statAtCost}: ${faNum(pw.atpCost, lang)}</span>
                <span>⚡ ${G.paths.statSpeed}: ${pw.speed > 200 ? "★★★" : pw.speed > 100 ? "★★" : "★"}</span>
                <span>◐ ${G.paths.statStealth}: ${pw.stealthLabel[lang]}</span>
              </div>
              <div class="path-ref">${pw.refNote}</div>
            </div>
          </div>`).join("")}
        <div class="apop-card">
          <div class="h"><span>${APOPTOTIC_BODY.name[lang]} · ${APOPTOTIC_BODY.size[lang]}</span>${hazardGlyph("stress", 24, "#B9A8C9")}</div>
          <p>${APOPTOTIC_BODY.origin[lang]}</p>
          <p style="color:var(--ink4)">${APOPTOTIC_BODY.note[lang]}</p>
        </div>
      </div>
      ${lf(1, "paths", doneList.includes("paths"))}
    </section>
    <section class="gsec" data-lesson="cargo" id="sec_cargo">
      ${lh(2, G.cargo.title, doneList.includes("cargo"))}
      <p>${CARGO_SCIENCE.intro[lang]}</p>
      <div class="cargo-cards">
        <div class="cargo-card rna">
          <div class="cc-head">${demandGlyph("rna", 20, "#9BE1FF")}<b>${CARGO_SCIENCE.rna.title[lang]}</b><span class="cargo-tag rna">${G.tagRna}</span></div>
          <p class="cc-note">${CARGO_SCIENCE.rna.note[lang]}</p>
          <div class="cc-items">
            ${CARGO_SCIENCE.rna.items.map((it) => `<div class="cargo-item"><span class="k">${typeof it.name === "string" ? it.name : it.name[lang]}</span><span class="v">${it.desc[lang]}</span></div>`).join("")}
          </div>
        </div>
        <div class="cargo-card protein">
          <div class="cc-head">${icon("tag", 20)}<b>${CARGO_SCIENCE.protein.title[lang]}</b><span class="cargo-tag protein">${G.tagProtein}</span></div>
          <p class="cc-note">${CARGO_SCIENCE.protein.note[lang]}</p>
          <div class="cc-items">
            ${CARGO_SCIENCE.protein.items.map((it) => `<div class="cargo-item"><span class="k">${typeof it.name === "string" ? it.name : it.name[lang]}</span><span class="v">${it.desc[lang]}</span></div>`).join("")}
          </div>
        </div>
      </div>
      <div class="demand-map">
        <div class="dm-title">${CARGO_SCIENCE.mapTitle[lang]}</div>
        <div class="guide-chiprow">
          ${DEMANDS.map((d) => `<div class="guide-chip">${demandGlyph(d.kind, 18, d.color)}<span>${d.name[lang]}</span><span class="cargo-tag ${d.nature}">${d.nature === "rna" ? G.tagRna : G.tagProtein}</span></div>`).join("")}
        </div>
        <p class="dm-note">${CARGO_SCIENCE.mapNote[lang]}</p>
      </div>
      ${lf(2, "cargo", doneList.includes("cargo"))}
    </section>
    <section class="gsec" data-lesson="scale" id="sec_scale">
      ${lh(3, G.scale.title, doneList.includes("scale"))}
      <p>${G.scale.intro}</p>
      <div class="scale-wrap ev-scroll">${sizeRulerSvg(lang, G.scale.logNote)}</div>
      ${lf(3, "scale", doneList.includes("scale"))}
    </section>
    <section class="gsec" data-lesson="misev" id="sec_misev">
      ${lh(4, G.misev.title, doneList.includes("misev"))}
      <p>${G.misev.intro}</p>
      <div class="pillars">
        ${MISEV_PILLARS.map((pi, i) => `
          <div class="pillar">
            <div class="h"><span class="ic">${icon(["tag", "crosshair", "micro", "file"][i], 17)}</span><h4>${pi.title[lang]}</h4></div>
            <p>${pi.body[lang]}</p>
          </div>`).join("")}
      </div>
      <div class="marker-table">
        <div class="mt-cap">${MARKER_TABLE.caption[lang]}</div>
        ${MARKER_TABLE.rows.map((r, i) => `
          <div class="mt-row">
            <div class="g">${r.group[lang]}</div>
            <div class="items">${r.items.map((m) => `<span class="ev-chip ${i < 2 ? "pos" : ""}" style="${i >= 2 ? "border-color:rgba(228,106,106,.2);background:rgba(228,106,106,.08);color:rgba(254,202,202,.9)" : ""}">${m}</span>`).join("")}</div>
            <div class="note">${r.note[lang]}</div>
          </div>`).join("")}
      </div>
      ${lf(4, "misev", doneList.includes("misev"))}
    </section>
    <section class="gsec" data-lesson="hazards" id="sec_hazards">
      ${lh(5, G.hazards.title, doneList.includes("hazards"))}
      <div class="hazards">
        ${G.hazards.items.map((h, i) => `
          <div class="hazard">${hazardGlyph(["macro", "opsonin", "stress"][i], 30, ["#B9C0CE", "#D9E2F2", "#E46A6A"][i])}<h4>${h.name}</h4><p>${h.body}</p></div>`).join("")}
      </div>
      ${lf(5, "hazards", doneList.includes("hazards"))}
    </section>
    <section class="gsec" data-lesson="play" id="sec_play">
      ${lh(6, G.play.title, doneList.includes("play"))}
      <div class="play-items">
        ${G.play.items.map((it, i) => `<div class="play-item"><span class="n tnum">${faNum(i + 1, lang)}</span><div><div class="k">${it.k}</div><p class="v">${it.v}</p></div></div>`).join("")}
      </div>
      ${lf(6, "play", doneList.includes("play"))}
    </section>
    <section class="gsec" data-lesson="score" id="sec_score">
      ${lh(7, G.score.title, doneList.includes("score"))}
      <div class="score-rows">
        ${G.score.items.map((it) => `<div class="score-row"><span class="k">${it.k}</span><span class="v">${it.v}</span></div>`).join("")}
      </div>
      ${lf(7, "score", doneList.includes("score"))}
    </section>
    <section class="gsec" data-lesson="refs" id="sec_refs">
      ${lh(8, G.refs.title, doneList.includes("refs"))}
      <div class="refs">
        ${REFERENCES.map((r) => `<div class="ref-card"><div class="r">${r.ref}</div><div class="n">${r.note[lang]}</div></div>`).join("")}
      </div>
      <div class="correction">
        <div class="k"><i></i><span>${G.refs.correctionTitle}</span></div>
        <p>${CORRECTION_NOTE[lang]}</p>
      </div>
      ${lf(8, "refs", doneList.includes("refs"))}
    </section>
    <section class="gsec cert-sec" id="sec_cert">
      ${allDone ? `
      <div class="cert-card on" id="certCard">
        <div class="cert-ic">${icon("trophy", 30)}</div>
        <div class="cert-t">${G.courseDoneTitle}</div>
        <p>${G.courseDoneBody}</p>
        <div class="cert-rank"><span>${G.courseRankNow}:</span><b>${L.curRank}</b></div>
        <button class="ev-btn-primary cert-cta" id="certCta">${icon("play", 15)}<span>${G.coursePlayCta}</span></button>
      </div>` : `
      <div class="cert-card lock" id="certLock">
        <div class="cert-ic">${icon("book", 26)}</div>
        <p>${G.courseLocked}</p>
        <div class="cert-count tnum">${faNum(doneList.length, lang)} ${S.common.ofWord} ${faNum(total, lang)}</div>
      </div>`}
    </section>
    <div class="guide-close-row"><button class="ev-btn-primary" id="gClose2">${returnLabel}</button></div>
  `;
  document.getElementById("gBack").addEventListener("click", () => { sfx.click(); closeGuide(); });
  document.getElementById("gClose2").addEventListener("click", () => { sfx.click(); closeGuide(); });
  document.getElementById("gLangG").addEventListener("click", () => { sfx.click(); toggleLang(); });
  const certCta = document.getElementById("certCta");
  if (certCta) certCta.addEventListener("click", () => { sfx.click(); closeGuide(); });
  document.querySelectorAll("#gNav button").forEach((btn) => {
    btn.addEventListener("click", () => {
      sfx.select();
      const sec = document.getElementById("sec_" + btn.dataset.sec);
      if (sec) sec.scrollIntoView({ behavior: "smooth", block: "start" });
    });
  });
  /* mark a lesson as read, then glide to the next one */
  document.querySelectorAll(".lesson-next").forEach((btn) => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.lesson;
      const wasDone = courseDoneList().includes(id);
      courseMarkDone(id);
      sfx.select();
      if (!wasDone) {
        btn.classList.add("done");
        btn.innerHTML = `${icon("check", 13)}<span>${G.markedDone}</span>`;
        const pill = document.querySelector(`#gNav button[data-sec="${id}"]`);
        if (pill && !pill.classList.contains("done")) {
          pill.classList.add("done");
          pill.insertAdjacentHTML("beforeend", icon("check", 11));
        }
        const title = btn.closest(".gsec").querySelector(".gsec-title");
        if (title) {
          title.classList.add("isdone");
          if (!title.querySelector(".lesson-donemark"))
            title.insertAdjacentHTML("beforeend", `<span class="lesson-donemark">${icon("check", 15)}</span>`);
        }
        updateCourseProgressUI();
      }
      const next = btn.dataset.next;
      if (next) {
        const el = document.getElementById("sec_" + next);
        if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
      } else {
        if (!wasDone) {
          /* last lesson read : rebuild the course and celebrate the certificate */
          sfx.discover();
          renderGuide();
        }
        const el = document.getElementById("sec_cert");
        if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
      }
    });
  });
  /* scroll spy : light up the pill of the lesson on screen */
  if (GUIDE_SPY) GUIDE_SPY.disconnect();
  GUIDE_SPY = new IntersectionObserver((ents) => {
    let seen = null;
    ents.forEach((en) => { if (en.isIntersecting) seen = en.target.dataset.lesson; });
    if (seen) document.querySelectorAll("#gNav button").forEach((b) => b.classList.toggle("on", b.dataset.sec === seen));
  }, { root: document.getElementById("viewGuide"), rootMargin: "-20% 0px -65% 0px", threshold: 0 });
  document.querySelectorAll(".gsec[data-lesson]").forEach((s) => GUIDE_SPY.observe(s));
}

/* ═══════════ global toggles ═══════════ */
function toggleLang() {
  STATE.lang = STATE.lang === "fa" ? "en" : STATE.lang === "en" ? "fr" : "fa";
  applyLang();
  sfx.muted = !STATE.soundOn;
  if (GAME) {
    GAME.engine.setLang(STATE.lang);
    GAME.engine.setFont(GAME.fontStack());
    GAME.renderHudSkeleton();
    GAME.hud = GAME.engine.getHud();
    GAME.updateHud();
    GAME.renderModal();
    GAME.renderToasts();
    GAME.renderBanner();
  }
  if (STATE.guideOpen) renderGuide();
  if (STATE.screen === "menu" || (!GAME && !STATE.guideOpen)) renderMenu();
}

function toggleSound() {
  STATE.soundOn = !STATE.soundOn;
  sfx.muted = !STATE.soundOn;
  lsSet("ev-sound", STATE.soundOn ? "1" : "0");
  if (!STATE.soundOn) sfx.setMusic(false);
  else if (STATE.musicOn) sfx.setMusic(true);
  sfx.click();
  refreshSoundIcons();
}
function toggleMusic() {
  STATE.musicOn = !STATE.musicOn;
  lsSet("ev-music", STATE.musicOn ? "1" : "0");
  if (STATE.soundOn) sfx.setMusic(STATE.musicOn);
  sfx.click();
  refreshSoundIcons();
}
function refreshSoundIcons() {
  if (STATE.screen === "menu") renderMenu();
  if (GAME) {
    const g = document.getElementById("gSfx");
    if (g) g.innerHTML = STATE.soundOn ? icon("vol") : icon("volx");
    if (GAME.manualPause && !GAME.over) GAME.renderModal();
  }
}

/* ═══════════ boot ═══════════ */
function boot() {
  loadPersisted();
  applyLang();
  sfx.muted = !STATE.soundOn;
  renderMenu();
  startMenuAmbient();
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => {
      if (GAME) GAME.engine.setFont(GAME.fontStack());
    });
  }
  document.addEventListener("pointerdown", () => sfx.unlock(), { once: true });
}
document.addEventListener("DOMContentLoaded", boot);

</script>
</body>
</html>
